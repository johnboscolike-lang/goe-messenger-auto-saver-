<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>쪽지 대소동</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@500;700;800&display=swap">
<style>
/* Layout: 세로 RPG 화면 하나 — 위 HUD, 가운데 학교 지도(탑뷰)·미니게임, 아래 조작부(조이스틱+A / 리듬 3버튼). 밤 교무실 + 분필색 한 가지 룩 */
:root {
  color-scheme: dark;
  --bg: #151A2E; --bg-out: #0D1020; --ink: #F6F2E6; --ink-2: #B9C0DA; --chalk: #FFD54A;
  --info: #6DB5FF; --act: #4FD69C; --hot: #FF5C6C; --on-key: #12152A; --card: #1F2645; --line: #34406E;
  --hr: #FF9F6B; --ad: #6DB5FF; --sub: #4FD69C;
  --f-display: "Do Hyeon", "Black Han Sans", "Malgun Gothic", sans-serif;
  --f-body: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg-out); color: var(--ink); font-family: var(--f-body); overflow: hidden; }
.game { position: relative; height: 100%; max-width: 560px; margin: 0 auto; overflow: hidden; background: var(--bg); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; display: flex; }
.stage { position: relative; flex: 1; min-width: 0; height: 100%; overflow: hidden; }

/* 세로 시간표 칸 */
.side { width: 84px; flex: none; height: 100%; background: #0E1226; border-right: 1px solid var(--line); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-width: 520px) { .side { width: 104px; } }
.side .clk { padding: 8px 4px 6px; text-align: center; border-bottom: 1px solid var(--line); }
.side .dy { font-family: var(--f-display); font-size: 14px; color: var(--chalk); line-height: 1.1; }
.side .tm { font-family: var(--f-display); font-size: 25px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.side .st { font-size: 10px; font-weight: 800; color: var(--ink-2); margin-top: 2px; line-height: 1.3; min-height: 26px; }
.side .st.hot { color: var(--hot); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .45; } }
.tlx { position: relative; flex: 1; margin: 8px 6px 6px 14px; min-height: 0; }
.slot { position: absolute; left: 0; right: 0; border-radius: 7px; padding: 0 4px; overflow: hidden; display: flex; flex-direction: column; justify-content: center; line-height: 1.12; color: var(--on-key); }
.slot b { font-family: var(--f-display); font-weight: 400; font-size: 14px; white-space: nowrap; }
.slot i { font-style: normal; font-size: 9px; font-weight: 800; opacity: .75; white-space: nowrap; }
.slot u { text-decoration: none; font-size: 9px; font-weight: 800; white-space: nowrap; }
.slot.g1 { background: var(--info); } .slot.g2 { background: var(--hr); } .slot.g3 { background: var(--act); }
.slot.free { border: 1.5px dashed #3B4778; color: var(--ink-2); background: rgba(255, 255, 255, .03); }
.slot.lunch { background: rgba(255, 213, 74, .16); color: var(--chalk); }
.slot.after { border: 1.5px dashed #3B4778; color: var(--ink-2); }
.slot.leave { background: repeating-linear-gradient(45deg, rgba(255, 92, 108, .22) 0 5px, transparent 5px 10px); color: var(--hot); border: 1.5px solid rgba(255, 92, 108, .5); }
.slot.past { opacity: .4; }
.slot.cur { box-shadow: 0 0 0 2.5px var(--chalk), 0 0 14px rgba(255, 213, 74, .55); opacity: 1; }
.slot.next { box-shadow: 0 0 0 1.5px var(--chalk); }
.slot .bd { position: absolute; top: 2px; right: 2px; font-size: 9px; font-weight: 800; border-radius: 5px; padding: 0 3px; background: #12152A; }
.slot .bd.ok { color: var(--act); } .slot .bd.late { color: var(--hr); } .slot .bd.miss { color: var(--hot); }
.slot .go { color: #12152A; background: var(--chalk); border-radius: 4px; padding: 0 3px; margin-top: 1px; align-self: flex-start; animation: blink 1s infinite; }
.slot.free .go, .slot.after .go { color: #12152A; }
.veil { position: absolute; left: -8px; right: -6px; top: 0; background: rgba(14, 18, 38, .5); pointer-events: none; }
.needle { position: absolute; left: -10px; right: -6px; height: 2px; background: var(--hot); box-shadow: 0 0 8px var(--hot); pointer-events: none; }
.needle::before { content: ""; position: absolute; left: -2px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--hot); }
.mk { position: absolute; left: -12px; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; }
.mk.msg { background: var(--info); } .mk.msg.unread { background: var(--hot); box-shadow: 0 0 6px var(--hot); }
.mk.due { left: auto; right: -6px; width: 0; height: 0; border-radius: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-right: 7px solid var(--hot); }
.hr { position: absolute; left: -14px; font-size: 8.5px; color: #59648E; transform: translateY(-50%); font-weight: 800; pointer-events: none; }
.side .nxt { margin: 0 6px 8px; border-radius: 10px; background: #1F2645; border: 1px solid var(--line); padding: 6px 5px; text-align: center; font-size: 10px; font-weight: 800; color: var(--ink-2); line-height: 1.35; cursor: pointer; font-family: var(--f-body); }
.side .nxt b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 15px; color: var(--ink); }
.side .nxt em { font-style: normal; color: var(--chalk); }
.side .nxt.hot { border-color: var(--hot); } .side .nxt.hot em { color: var(--hot); }
/* 직업별 캠페인 · 업무포털 · 퀘스트 */
.slot.gs { background: #B48CFF; } .tt td.gs { background: #B48CFF; }
.slot.sports, .slot.trip { background: repeating-linear-gradient(45deg, rgba(79, 214, 156, .35) 0 6px, rgba(79, 214, 156, .15) 6px 12px); color: var(--act); border: 1.5px solid rgba(79, 214, 156, .6); }
.slot .swp { font-style: normal; background: #12152A; color: var(--chalk); border-radius: 3px; padding: 0 2px; }
.mk.duty { left: auto; right: -9px; width: 12px; height: 12px; border-radius: 0; font-size: 10px; line-height: 12px; color: var(--chalk); text-align: center; }
.mk.duty.done { color: var(--act); }
.side .wk span { color: var(--ink-2); }
.tt td.ev { background: repeating-linear-gradient(45deg, rgba(255, 92, 108, .2) 0 4px, transparent 4px 8px); color: var(--hot); font-weight: 800; font-size: 10.5px; }
.tt td.sw { outline: 2px dashed var(--chalk); outline-offset: -3px; }
.panel .tt td.ev { color: #C62828; }
.panel.portal { background: #EEF1F7; }
.portal .ph { background: #1B2550; }
.ptabs { display: flex; gap: 0; background: #27305A; padding: 0 4px; overflow-x: auto; scrollbar-width: none; flex: none; }
.ptabs::-webkit-scrollbar { display: none; }
.ptabs button { flex: none; background: none; border: 0; color: #B9C0DA; font-weight: 800; font-size: 12.5px; padding: 8px 9px 6px; cursor: pointer; border-bottom: 3px solid transparent; font-family: var(--f-body); }
.ptabs button.on { color: #fff; border-bottom-color: #FFD54A; }
.ptabs button i { font-style: normal; background: #FF5C6C; color: #fff; border-radius: 8px; padding: 0 5px; font-size: 10px; margin-left: 3px; }
.mywork, .notice { margin: 10px 10px 0; background: #fff; border: 1px solid #C9D3E3; border-radius: 12px; padding: 9px 10px; }
.mywork h5, .notice h5 { margin: 0 0 7px; font-size: 13px; color: #1B2340; display: flex; justify-content: space-between; gap: 6px; }
.mywork h5 span { font-size: 11px; color: #6A7393; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mw4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.mw4 button { background: #F4F6FA; border: 1px solid #DDE3EE; border-radius: 10px; padding: 7px 2px 6px; font-size: 11px; font-weight: 800; color: #4A5675; cursor: pointer; font-family: var(--f-body); }
.mw4 button b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 22px; color: #1F4E9C; line-height: 1.1; }
.mw4 button.hot { border-color: #FFB3BC; background: #FFF1F3; } .mw4 button.hot b { color: #C62828; }
.mwl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 12px; margin-top: 7px; font-size: 11.5px; font-weight: 700; color: #4A5675; }
.mwl span { display: flex; justify-content: space-between; border-bottom: 1px dashed #DDE3EE; padding: 3px 0; }
.mwl b { color: #1B2340; }
.notice div { padding: 4px 0; border-bottom: 1px solid #EEF2F8; color: #1B2340; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.notice div:last-child { border-bottom: 0; }
.pintro { margin: 10px 10px 0; padding: 8px 10px; border-radius: 10px; color: #fff; font-size: 12px; font-weight: 800; background: #27305A; }
.pintro.sys-neis { background: #1F4E9C; } .pintro.sys-edufine { background: #0E7C66; } .pintro.sys-edoc { background: #4A3F8C; } .pintro.sys-agg { background: #8C5A1F; } .pintro.sys-msgr { background: #1F7A8C; }
.cat.gong { background: #8C5A1F; }
.row.gong { background: #FFF3E0; border-color: #E8B36A; }
.sys.edoc .ph { background: #4A3F8C; } .sys.agg .ph { background: #8C5A1F; } .sys.msgr .ph { background: #1F7A8C; }
.neis { margin: 8px 12px 4px; border: 1px solid #9FB3D6; border-radius: 8px; overflow: hidden; background: #fff; font-size: 11px; }
.neis .nb { display: flex; align-items: center; gap: 6px; background: #163A78; color: #fff; padding: 5px 8px; }
.neis.fin .nb { background: #0B5E4E; }
.neis .nb b { font-family: var(--f-display); font-weight: 400; font-size: 14px; letter-spacing: .5px; flex: none; }
.neis .nb span { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.neis .nb em { font-style: normal; white-space: nowrap; padding: 2px 5px; border-radius: 4px; opacity: .65; font-weight: 700; }
.neis .nb em.on { background: #FFD54A; color: #12152A; opacity: 1; font-weight: 800; }
.neis .nq { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; padding: 5px 8px; background: #EEF3FB; border-bottom: 1px solid #C9D3E3; color: #4A5675; font-weight: 700; }
.neis .nq i { font-style: normal; display: inline-block; min-width: 24px; padding: 0 4px; margin-left: 2px; background: #fff; border: 1px solid #AEBBD2; border-radius: 3px; color: #1B2340; }
.nqb { margin-left: auto; background: #1F4E9C; color: #fff; border-radius: 4px; padding: 1px 10px; }
.ng { width: 100%; border-collapse: collapse; font-size: 11px; }
.ng th { background: #DDE6F4; color: #4A5675; border: 1px solid #C9D3E3; padding: 3px 5px; font-weight: 800; }
.ng td { border: 1px solid #E1E7F0; padding: 3px 5px; color: #1B2340; text-align: center; }
.ng tr.hl td { background: #FFF6C4; font-weight: 800; }
.edoc { margin: 8px 12px 4px; background: #fff; border: 1px solid #C2BBE3; border-radius: 8px; padding: 6px 8px; font-size: 11px; color: #4A5675; }
.edoc .eh { display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; font-weight: 700; }
.edoc .eh b { color: #1B2340; }
.edoc .sl { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 6px; border: 1px solid #C2BBE3; }
.edoc .sl div { border-left: 1px solid #C2BBE3; text-align: center; } .edoc .sl div:first-child { border-left: 0; }
.edoc .sl i { display: block; font-style: normal; background: #EEEBFA; font-weight: 800; padding: 2px 0; }
.edoc .sl b { display: block; height: 26px; line-height: 26px; color: #B9C0DA; }
.edoc .sl b.st { color: #D23B2E; font-family: var(--f-display); font-weight: 400; font-size: 15px; }
.msgr { margin: 8px 12px 4px; background: #fff; border: 1px solid #9CCAD6; border-radius: 10px; overflow: hidden; font-size: 12px; }
.msgr .mh { background: #1F7A8C; color: #fff; font-weight: 800; padding: 5px 9px; display: flex; justify-content: space-between; }
.msgr .ml { display: flex; gap: 8px; padding: 5px 9px; border-bottom: 1px solid #E3EEF2; color: #1B2340; font-weight: 700; }
.msgr .ml i { font-style: normal; color: #6A7393; min-width: 52px; }
.msgr .mbd { padding: 8px 9px; min-height: 44px; color: #1B2340; border-bottom: 1px solid #E3EEF2; }
.msgr u { text-decoration: none; color: #B7C1D6; }
.agg { margin: 8px 12px 4px; background: #fff; border: 1px solid #E0C39A; border-radius: 8px; overflow: hidden; }
.agg .ah { background: #8C5A1F; color: #fff; font-size: 12px; font-weight: 800; padding: 5px 8px; display: flex; justify-content: space-between; }
.panel .info { margin: 6px 12px 0; padding: 7px 10px; border-radius: 8px; background: #E8F1FF; border: 1px dashed #6D8FC9; font-size: 12.5px; font-weight: 700; color: #1B2340; }
.sheet .who { font-family: var(--f-display); font-size: 17px; color: #1B2340; line-height: 1.25; }
.sheet .who small { font-family: var(--f-body); font-size: 11.5px; color: #6A7393; font-weight: 700; }
.kids { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.kid { background: #fff; border: 1px solid #C9D3E3; border-radius: 10px; padding: 7px 8px; font-size: 11px; color: #1B2340; }
.kid b { font-size: 13px; } .kid em { font-style: normal; margin-left: 5px; background: #FFE9EC; color: #C62828; border-radius: 5px; padding: 0 4px; font-weight: 800; font-size: 10.5px; }
.kid small { display: block; color: #6A7393; font-weight: 700; margin: 2px 0 4px; }
.kid .ks { display: grid; gap: 2px; }
.kid .ks span { display: grid; grid-template-columns: 26px 1fr; align-items: center; gap: 4px; font-weight: 800; color: #4A5675; font-size: 10px; }
.mb { display: block; height: 6px; background: #EEF2F8; border-radius: 3px; overflow: hidden; } .mb i { display: block; height: 100%; }
.quest { position: absolute; z-index: 4; display: flex; flex-direction: column; gap: 3px; }
.quest .qh { font-family: var(--f-display); font-size: 12px; color: var(--chalk); text-shadow: 0 1px 3px #000; padding: 0 3px; }
.quest .qh b { font-weight: 400; background: var(--hot); color: #fff; border-radius: 7px; padding: 0 5px; }
.quest button { display: flex; gap: 5px; align-items: flex-start; text-align: left; width: 100%; background: rgba(10, 14, 30, .8); border: 1px solid rgba(90, 111, 176, .7); border-radius: 8px; padding: 4px 6px; color: #fff; font-size: 11px; font-weight: 800; cursor: pointer; font-family: var(--f-body); line-height: 1.25; }
.quest button i { flex: none; width: 7px; height: 7px; border-radius: 4px; margin-top: 4px; }
.quest button span { min-width: 0; display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.quest small { display: block; font-size: 9.5px; color: #B9C0DA; font-weight: 700; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.quest button.hot { border-color: rgba(255, 92, 108, .8); } .quest button.hot small { color: #FF9AA5; }
.quest button.new { border-color: var(--chalk); animation: qnew 1s ease-out 3; }
@keyframes qnew { 0% { transform: translateX(24px); opacity: 0; background: rgba(255, 213, 74, .9); } 45% { transform: none; opacity: 1; background: rgba(255, 213, 74, .45); } 100% { background: rgba(10, 14, 30, .8); } }
.gsel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 8px; }
.gsel button, .rsel button { border: 2px solid var(--line); background: #1A2040; color: var(--ink); border-radius: 12px; padding: 8px 4px; font-weight: 800; font-size: 14px; cursor: pointer; font-family: var(--f-body); min-width: 0; }
.gsel button.on, .rsel button.on { border-color: var(--chalk); background: #3A3420; color: var(--chalk); }
.rsel { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.rsel button b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 19px; line-height: 1.1; }
.rsel button small { display: block; font-size: 10px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rsel button.sp b { color: #C9A8FF; } .rsel button.sp.on b { color: var(--chalk); }
.rdesc { margin: 8px 0 0; text-align: left; background: #1A2040; border-radius: 12px; padding: 9px 11px; font-size: 12.5px; line-height: 1.5; color: var(--ink); }
.rdesc span { color: var(--ink-2); font-size: 11.5px; }
.brief { text-align: left; margin: 10px 0 4px; display: grid; gap: 4px; }
.brief div { background: #1A2040; border-radius: 8px; padding: 6px 9px; font-size: 12.5px; font-weight: 700; line-height: 1.35; }
.kmood { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; margin: 8px 0 0; font-size: 20px; }
.kmood span { display: grid; justify-items: center; } .kmood small { font-size: 10px; color: var(--ink-2); }
@media (prefers-reduced-motion: reduce) { .quest button.new { animation: none; } }
.panel .tt th, .panel .tt td { border-color: #C9D3E3; color: #1B2340; }
.panel .tt td.c { color: #12152A; } .panel .tt th { background: #EEF2F8; color: #4A5675; } .panel .tt th.today { background: #FFF6C4; color: #1B2340; }
.panel .tt td.lv { color: #C62828; }
.panel .ttwrap { padding: 4px 10px 12px; }
@media (min-width: 520px) { .game { box-shadow: 0 0 0 1px var(--line), 0 30px 80px rgba(0, 0, 0, .5); } }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
button { font-family: inherit; }

.top { display: flex; gap: 3px; justify-content: center; margin-top: 6px; }
.ib { width: 24px; height: 24px; border-radius: 7px; border: 1px solid var(--line); background: #1F2645; color: var(--ink); font-size: 11px; cursor: pointer; display: grid; place-items: center; padding: 0; }
@media (min-width: 520px) { .ib { width: 30px; height: 28px; font-size: 13px; } }
.side .home { display: inline-block; font-size: 9.5px; font-weight: 800; color: #12152A; background: var(--hr); border-radius: 5px; padding: 0 5px; margin: 2px 0 1px; }
.side .wk { font-size: 9.5px; font-weight: 800; color: var(--hot); line-height: 1.3; }
.ib:focus-visible, .key:focus-visible, .btn:focus-visible, .abtn:focus-visible, .panel button:focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; }

.abtn { position: absolute; right: 16px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 84px; height: 84px; border-radius: 50%; border: 0; background: var(--chalk); color: var(--on-key); z-index: 5; box-shadow: 0 6px 0 #9B6B00, 0 10px 30px rgba(0, 0, 0, .4); display: grid; place-items: center; align-content: center; cursor: pointer; touch-action: none; }
.abtn b { font-family: var(--f-display); font-size: 30px; font-weight: 400; line-height: 1; }
.abtn span { font-size: 11px; font-weight: 800; max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dbtn { position: absolute; right: 26px; bottom: calc(120px + env(safe-area-inset-bottom, 0px)); width: 66px; height: 66px; border-radius: 50%; border: 0; background: var(--hot); color: #fff; z-index: 5; box-shadow: 0 5px 0 #9B2A36, 0 8px 24px rgba(255, 92, 108, .4); display: grid; place-items: center; align-content: center; cursor: pointer; touch-action: none; }
.dbtn b { font-size: 24px; line-height: 1; }
.dbtn span { font-size: 10.5px; font-weight: 800; }
.dbtn.cd { background: #4A3A58; box-shadow: 0 5px 0 #2A2238; }
.dbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 #9B2A36; }
.abtn.off { background: #3A4470; color: var(--ink-2); box-shadow: 0 6px 0 #232A4C; }
.abtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #9B6B00; }

.pad { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 1fr 1.08fr 1fr; gap: 8px; padding: 8px 10px calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
.key { height: 62px; border-radius: 16px; border: 0; color: var(--on-key); cursor: pointer; display: grid; place-items: center; align-content: center; box-shadow: 0 5px 0 rgba(0, 0, 0, .38); font-family: var(--f-display); touch-action: none; }
.key b { font-size: 21px; line-height: 1.05; font-weight: 400; }
.key span { font-family: var(--f-body); font-weight: 800; font-size: 11px; opacity: .8; }
.key.l { background: var(--info); } .key.u { background: var(--hot); } .key.r { background: var(--act); }

/* 대화창 (RPG 텍스트 박스) */

  function setPad(labels) {

  }

  function attendMini(cls, p, urgent) {
    const roster = rosterOf(cls).slice(0, p === 0 ? 8 : 6);
    const items = roster.map((name, i) => ({ name, state: 'present', call: 6 + i * 2, j: null, seat: i }));
    if (urgent && WP().morning === 'sick') items[0].state = 'absent';
    if (urgent && WP().morning === 'late') items[1].state = 'late';
    if (!urgent) {
      const idx = shuffle(items.map((_, i) => i));
      if (Math.random() < 0.6) items[idx[0]].state = 'absent';
      if (Math.random() < 0.6) items[idx[1]].state = 'late';
    }
    const EXP = { present: 'up', absent: 'left', late: 'right' };
    return {
      bpm: urgent ? 138 : 112 + Math.min(8, G.wk) * 2, style: urgent ? 'urgent' : 'class', items, bowJ: null, errors: [],
      pad: [['← 결석', '빈자리'], ['↑ 출석', '“네!” / 경례'], ['지각 →', '문으로 헐레벌떡']],
      enter() { banner('차렷, 경례!', '3박째에 ↑ 로 인사 → 이름이 불리면 다음 박자에 체크', true); },
      update(dt, st, b, now) {
        const bl = 60 / this.bpm;
        if (this.bowJ == null && now > this.t0 + 3 * bl + 0.2) { this.bowJ = 'miss'; }
        for (const it of items) {
          if (!it.j && now > this.t0 + (it.call + 1) * bl + jw(0.18, '담임')) { it.j = 'miss'; this.err(it, '확인 못 함'); }
        }
        if (b > items[items.length - 1].call + 2.5) this.done = true;
      },
      err(it, why) {
        G.combo = 0; hurt(2); sfx.bad();
        this.errors.push(it);
        pop(VW / 2, VH * 0.5, why, C.hot, 18);
      },
      input(dir, now) {
        const bl = 60 / this.bpm;
        if (this.bowJ == null) {
          if (dir !== 'up') return;
          const j = judge(now - (this.t0 + 3 * bl), '담임');
          this.bowJ = j || 'early'; if (j) { sfx.good(); pop(VW / 2, VH * 0.3, j === 'perfect' ? 'PERFECT 경례!' : '경례!', C.chalk, 22); gainXP('담임', 2); }
          return;
        }
        const it = items.find((x) => !x.j && now >= this.t0 + (x.call + 0.4) * bl && now <= this.t0 + (x.call + 1) * bl + jw(0.18, '담임'));
        if (!it) return;
        if (dir !== EXP[it.state]) { it.j = 'wrong'; this.err(it, `${it.name}: ${it.state === 'present' ? '출석' : it.state === 'absent' ? '결석' : '지각'}이었어요`); return; }
        const j = judge(now - (this.t0 + (it.call + 1) * bl), '담임') || 'good';
        it.j = j; G.combo++; sfx.good(G.combo);
        if (j === 'perfect') { sfx.perfect(); pop(VW / 2, VH * 0.24, 'PERFECT', C.chalk, 22); }
        gainXP('담임', j === 'perfect' ? 4 : 3);
      },
      exit() {
        const e = this.errors.find((x) => x.state !== 'present' || true);
        if (this.errors.length) {
          const it = this.errors[0];
          const to = it.state === 'present' ? '출석' : it.state === 'absent' ? '결석' : '지각';
          addTask({ cat: '담임', title: `${it.name} 출결 정정 (나이스)`, param: { name: it.name, to }, steps: [{ at: 'pc', game: 'neis-fix', min: 10 }], due: dueAbs(G.wk, T('16:30')), xp: 40 });
          toast('출결 실수 → 나이스 출결 정정이 할 일에 추가됐어요', 'bad');
        }
        void e;
      },
      draw(st, b, now) {
        drawClassroom('front', this, b, now);

  const TELL_REAL = ['가방 지퍼를 닫는다…!', '노선도 보며 엉덩이 들썩', '외투를 입기 시작했다', '휴대폰을 주머니에 쏙'];

  const TELL_SLEEP = ['눈 감고 종점까지 갈 기세', '이어폰 끼고 무아지경', '고개 끄덕끄덕 숙면 중'];

  const SEAT_LOSE = ['옆 아저씨가 순간이동으로 착석 ㅋㅋ', '눈치 게임 패배… 서서 가요', '가방이 먼저 앉았다(?)', '등산복 부대가 싹쓸이…'];
  const CROWD = ['(누군가의 백팩이 얼굴을 누른다)', '(이번 역은 환승역입니다~)', '(손잡이 쟁탈전 패배)', '(옆 사람 이어폰 노래가 다 들린다)', '(문이 닫힙니다~ 닫힙니다~)', '(발이 공중에 떠 있다…?)'];
  function subwayMini(dir, light) {
    const home = dir === 'home';
    const LN = home ? ['신분당선', '3호선', '2호선', '4호선'] : ['4호선', '2호선', '3호선', '신분당선'];

    const legs = LN.map((ln, i) => {
      const order = shuffle([0, 1, 2]);
      const tell = []; tell[order[0]] = rnd(TELL_REAL); tell[order[1]] = rnd(TELL_FAKE); tell[order[2]] = rnd(TELL_SLEEP);
      const b0 = 2 + i * 12;
      return { ln, i, b0, real: order[0], fake: order[1], tell, pick: null, res: null, push: [b0 + 2, b0 + 3].map((b) => ({ b, j: null })), run: i < 3 ? [b0 + 9, b0 + 10, b0 + 11].map((b) => ({ b, j: null })) : [], gag: rnd(CROWD) };
    });
    return {
      bpm: 118, style: home ? 'world' : 'urgent', legs, delay: 0, drain: 0, sat: 0, home, light, ST,
      pad: [['← 왼쪽 앞', '서기'], ['↑ 밀기·가운데', '달리기'], ['오른쪽 앞 →', '서기']],
      enter() { banner(home ? (light ? '조퇴길 지하철' : '퇴근길 만원 지하철') : '출근길 만원 지하철', '환승 3번 · 내릴 사람 앞에 서서 자리 쟁취!', true); },
      leg(b) { return this.legs.find((L) => b >= L.b0 && b < L.b0 + 12) || null; },
      update(dt, st, b, now) {
        const bl = 60 / this.bpm;
        for (const L of this.legs) {
          for (const n of L.push.concat(L.run)) if (!n.j && now > this.t0 + n.b * bl + jw(0.2, '행정')) { n.j = 'miss'; if (L.push.includes(n)) { this.hurt(2, '문에 끼임!'); } }
          if (!L.res && b >= L.b0 + 7.5) {
            L.res = L.pick === L.real ? 'win' : 'lose';
            const d = L.res === 'win' ? 1 : (home ? 9 : 7) * (light ? 0.5 : 1);
            this.hurt(d); if (L.res === 'win') { this.sat++; sfx.up(); } else sfx.bad();
            L.msg = rnd(L.res === 'win' ? SEAT_WIN : SEAT_LOSE);
          }
          if (L.run.length && !L.ran && b >= L.b0 + 11.8) {
            L.ran = true;
            const miss = L.run.filter((n) => n.j === 'miss').length;
            if (miss >= 2) { this.delay += 4; this.hurt(2); L.runMsg = '환승 열차 놓침… 4분 지연'; } else L.runMsg = '환승 성공!';
          }
        }
        if (b > 2 + 4 * 12 - 2.5 && !this.done) {
          this.done = true;
          toast(`${home ? '퇴근' : '출근'} 완료 · 체력 −${Math.round(this.drain)} · 착석 ${this.sat}/4${this.delay ? ` · ${this.delay}분 지연` : ''}`, this.sat >= 2 ? 'ok' : 'bad');
        }
      },
      hurt(n, why) { this.drain += n; G.hp = clamp(G.hp - n, 0, 100); if (why) pop(VW / 2, VH * 0.6, why, C.hot, 16); G.flash = 0.25; },
      input(dir, now) {
        const bl = 60 / this.bpm, b = (now - this.t0) / bl, L = this.leg(b);
        if (!L) return;
        const rel = b - L.b0;
        if (rel < 3.7 || rel >= 8.5) {
          if (dir !== 'up') return;
          const list = rel < 3.7 ? L.push : L.run;
          const n = list.find((x) => !x.j && Math.abs(now - (this.t0 + x.b * bl)) < jw(0.2, '행정'));
          if (!n) return;
          n.j = judge(now - (this.t0 + n.b * bl), '행정') || 'good'; sfx.good();
          pop(VW / 2, VH * 0.62, rel < 3.7 ? '밀어!' : '다다다!', C.chalk, 20);
          return;
        }
        if (rel < 7.4) { L.pick = { left: 0, up: 1, right: 2 }[dir]; sfx.key(); }
      },
      draw(st, b, now) { drawSubway(this, b, now); },
    };
  }

      h += `<div class="veil" id="sVeil"></div><div class="needle" id="sNeedle"></div>`;
      $('tlx').innerHTML = h;
      const nx = $('sNext'), L = LEAVE_(), dueToday = pendingTasks().filter((t) => Math.floor(t.due / 1440) === G.wk).length;
      const du = duties().find((x) => !G.done[x.id] && m >= x.at - 30 && m < x.at + 20);
      let html, hot = false;
      if (HOME && !G.done.jo && m < JO_END && WP().special !== 'trip') { const left = Math.ceil(johoeAt() - m); html = `조회 · ${HOME}<b>${left > 0 ? `${left}분 뒤` : '지금!'}</b>`; hot = left <= 5; }
      else if (du && (!nc || du.at <= nc.s)) { const left = Math.ceil(du.at - m); html = `${esc(du.title)}<b>${hm(du.at)}</b><em>${left > 0 ? `${left}분 뒤 · ${locName(du.loc)}` : '지금 가기!'}</em>`; hot = left <= 5; }
      else if (nc) { const left = Math.ceil(nc.s - m); html = `다음 수업<b>${nc.p}교시 ${nc.cls}</b><em>${left > 0 ? `${left}분 뒤` : '지금 교실로!'}</em>`; hot = left <= 5; }
      else if (L) html = `오늘 조퇴<b>${hm(L.at)}</b><em>복무 상신 먼저</em>`;
      else html = `퇴근<b>${hm(OFF)}</b><em>${m >= OFF ? '현관으로!' : '남은 업무 처리'}</em>`;
      if (dueToday) html += `<br><span style="color:var(--hot)">오늘 마감 ${dueToday}건</span>`;
      nx.innerHTML = html; nx.classList.toggle('hot', hot);
      $('sWk').innerHTML = `${G.wk + 1}주차 · ${esc(WP().label)}<br><span>${esc(WP().title)}</span>`;
    }
    $('sDay').textContent = `${DAYS[G.day]}요일`;
    $('sTime').textContent = hm(Math.min(m, T('23:59')));
    const stEl = $('sSt');
    let st = '쉬는 시간', hotSt = false;

    else if (HOME && !G.done.jo && m < JO_END) { st = G.urgentJo ? '긴급 0교시!' : '조회 준비'; hotSt = G.urgentJo; }
    else if (cur) { st = cur.trip ? '수학여행' : cur.lunch ? (ROLE.special === 'nutri' ? '배식 시간' : '점심시간') : cur.sports ? '운동회' : cur.cls ? (G.done[cur.id] ? '수업 완료' : `${cur.name} 수업!`) : `${cur.name} 공강`; hotSt = !!(cur.cls && !G.done[cur.id]); }
    else if (m >= OFF) st = '퇴근 시간';
    stEl.textContent = st; stEl.classList.toggle('hot', hotSt);
    const y = pctT(m);
    const nd = $('sNeedle'), vl = $('sVeil');

  }
  $('sNext').addEventListener('click', () => { audioInit(); openTT(); });
  $('tlx').addEventListener('click', () => { audioInit(); openTT(); });
  const ttOf = (d) => (ROLE.special === 'sped' ? SPED_TT[d] : ROLE.special === 'nurse' ? NURSE_TT[d] : ROLE.special === 'nutri' ? NUTRI_TT[d] : TIMETABLE[d]);
  function ttTable() {
    const P = WP(), today = P.day, away = ROLE.special === 'nutri' || ROLE.special === 'nurse';

  }
  function openTT() {
    if (G.mode !== 'world') return;

    p.innerHTML = `<div class="ph"><b>주간 시간표</b><span>${esc(roleLabel())} · 주 ${hoursOf()}시수 · ${esc(WP().label)}</span><button class="x" type="button" data-close="1">닫기</button></div>
      <div class="scroll ttwrap">${ttTable()}<div class="perk" style="margin-top:10px">파랑 1학년 · 주황 2학년 · 초록 3학년 · 보라 특수학급 · 빈칸은 공강<br>점선 칸은 이번 주 <b>시간표 변경</b> · 빨간 칸은 행사·시험·조퇴<br>왼쪽 시간표의 <b style="color:#C62828">빨간 바늘</b>이 지금 시각, <b>✉ 점</b>은 쪽지, <b>★</b>는 일과, <b>◀</b>는 오늘 마감이에요.</div></div>`;
  }

  /* =====================================================================
     업데이트 · 입력 · 루프
     ===================================================================== */
  function update(dt) {
    G.simClock += dt;
    if (G.paused) return;
    for (const p of G.pops) { p.t += dt; p.y -= 34 * dt; }
    G.pops = G.pops.filter((p) => p.t < 1);
    for (const f of G.fx) { f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 420 * dt; }
    G.fx = G.fx.filter((f) => f.t < f.life);
    if (G.banner) { G.banner.t += dt; if (G.banner.t > (G.banner.short ? 1.6 : 2.6)) G.banner = null; }
    if (G.toast) { G.toast.t += dt; if (G.toast.t > 3) G.toast = null; }
    G.flash = Math.max(0, G.flash - dt);
    G.dashCd = Math.max(0, (G.dashCd || 0) - dt);
    if (G.mode === 'world') {
      moveWorld(dt);
      // 학생 인사 · 아픈 학생 이동
      for (const w of G.wander) if (Math.hypot(w.x - G.px, w.y - G.py) < 46 && (!w.cd || G.simClock > w.cd)) { w.say = rnd(GREET); w.sayT = G.simClock; w.cd = G.simClock + 12; }
      if (G.kid && G.kid.mode === 'seek') {
        G.kid.pt -= dt;
        if (G.kid.pt <= 0 || !G.kid.path) { G.kid.pt = 0.8; G.kid.path = bfsFrom(Math.floor(G.kid.x / TS), Math.floor(G.kid.y / TS), Math.floor(G.px / TS), Math.floor(G.py / TS)); G.kid.pi = 1; }
        const pth = G.kid.path;
        if (pth && G.kid.pi < pth.length) { const tg = pth[G.kid.pi], dx = tg.x - G.kid.x, dy = tg.y - G.kid.y, l = Math.hypot(dx, dy), st = 70 * dt; if (l <= st) { G.kid.x = tg.x; G.kid.y = tg.y; G.kid.pi++; } else { G.kid.x += dx / l * st; G.kid.y += dy / l * st; } }
      }
      const db = $('dBtn'); db.hidden = false; db.classList.toggle('cd', G.dashCd > 0 || G.hp < 10); $('dLbl').textContent = G.dash ? '질주 중' : G.dashCd > 0 ? `${Math.ceil(G.dashCd)}초` : '질주 −6';
      for (const w of G.wander) { w.t += dt; if (Math.random() < dt * 0.6) { const a = Math.random() * 6.28; w.vx = Math.cos(a) * 40; w.vy = Math.sin(a) * 40; } const nx = w.x + w.vx * dt, ny = w.y + w.vy * dt; if (!blocked(nx, ny, 8)) { w.x = nx; w.y = ny; } else { w.vx = -w.vx; w.vy = -w.vy; } }
      G.near = findNear();

    } else if (G.mode === 'mini' && G.mini) {
      $('dBtn').hidden = true;
      const m = G.mini, now = clockNow(), st = now - m.t0, b = st * m.bpm / 60;
      if (m.update) m.update(dt, st, b, now);

    }
    if (G.mode !== 'world' && G.mode !== 'map') $('dBtn').hidden = true;
    if (G.life <= 0 && G.mode !== 'card' && G.mode !== 'title') lifeOver();
    else if (G.hp <= 0 && G.mode !== 'card' && G.mode !== 'title' && !(G.mode === 'mini' && G.mini && G.mini.legs)) burnout();
  }
  function draw() {
    g.setTransform(DPR * SC, 0, 0, DPR * SC, 0, 0);
    const t = G.simClock;
    if (G.mode === 'mini' && G.mini) { const m = G.mini, now = clockNow(); m.draw(now - m.t0, (now - m.t0) * m.bpm / 60, now); }
    else if (G.mode === 'title' || (G.mode === 'card' && !G.dayLog)) { drawOfficeBG(t * 1.5); }
    else drawWorld(t);
    if (G.mode !== 'title' && G.dayLog && G.mode !== 'map') drawHUD();

  function act(dir) {

  }
  function flashKey(dir) { const k = document.querySelector(`.key[data-dir="${dir}"]`); if (!k) return; k.classList.add('hit'); setTimeout(() => k.classList.remove('hit'), 90); }
  document.querySelectorAll('.key').forEach((k) => k.addEventListener('pointerdown', (e) => { e.preventDefault(); audioInit(); act(k.dataset.dir); }));
  $('aBtn').addEventListener('click', () => { audioInit(); interact(); });
  $('dBtn').addEventListener('click', () => { audioInit(); dash(); });
  // 조이스틱 (지도) / 스와이프 (미니게임)
  let sw = null;
  const toV = (e) => { const r = stage.getBoundingClientRect(); return { x: (e.clientX - r.left) / SC, y: (e.clientY - r.top) / SC }; };

    else { hideOverlay(); if (m && m.pausedAt != null) { m.t0 += clockNow() - m.pausedAt; m.pausedAt = null; if (m.style) musicAt(m.t0, m.bpm, m.style); } else if (G.mode !== 'mini') musicWorld(); }
  }

  function toggleMute() {

    try { localStorage.setItem('jjokji-muted', muted ? '1' : '0'); } catch (e) { /* 저장소 없음 */ }
    if (A.master) A.master.gain.setTargetAtTime(muted ? 0 : 0.85, A.ctx.currentTime, 0.02);
    $('muteBtn').textContent = muted ? '×' : '♪'; $('muteBtn').setAttribute('aria-label', muted ? '소리 켜기' : '소리 끄기');
  }
  $('muteBtn').addEventListener('click', () => { audioInit(); toggleMute(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && !G.paused && (G.mode === 'world' || G.mode === 'mini')) setPause(true); });

  let last = performance.now();
  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    update(dt); draw(); renderSide(); renderQuest();
    requestAnimationFrame(frame);
  }
