<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>노량진 D-day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@500;700;800&display=swap">
<style>
/* Layout: 세로 RPG 화면 하나 — 왼쪽 시간표 칸, 위 HUD, 가운데 탑뷰 지도·미니게임, 아래 조작부(조이스틱+A / 리듬 3버튼). 밤 교무실 + 분필색 한 가지 룩 (쪽지 대소동과 동일) */
:root {
  color-scheme: dark;
  --bg: #151A2E; --bg-out: #0D1020; --ink: #F6F2E6; --ink-2: #B9C0DA; --chalk: #FFD54A;
  --info: #6DB5FF; --act: #4FD69C; --hot: #FF5C6C; --on-key: #12152A; --card: #1F2645; --line: #34406E;
  --hr: #FF9F6B; --ad: #6DB5FF; --sub: #4FD69C;
  --f-display: "Do Hyeon", "Black Han Sans", "Malgun Gothic", sans-serif;
  --f-body: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg-out); color: var(--ink); font-family: var(--f-body); overflow: hidden; }
.game { position: relative; height: 100%; max-width: 560px; margin: 0 auto; overflow: hidden; background: var(--bg); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; display: flex; }
.stage { position: relative; flex: 1; min-width: 0; height: 100%; overflow: hidden; }

/* 세로 시간표 칸 */
.side { width: 84px; flex: none; height: 100%; background: #0E1226; border-right: 1px solid var(--line); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-width: 520px) { .side { width: 104px; } }
.side .clk { padding: 8px 4px 6px; text-align: center; border-bottom: 1px solid var(--line); }
.side .dy { font-family: var(--f-display); font-size: 14px; color: var(--chalk); line-height: 1.1; }
.side .tm { font-family: var(--f-display); font-size: 25px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.side .st { font-size: 10px; font-weight: 800; color: var(--ink-2); margin-top: 2px; line-height: 1.3; min-height: 26px; }
.side .st.hot { color: var(--hot); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .45; } }
.tlx { position: relative; flex: 1; margin: 8px 6px 6px 14px; min-height: 0; }
.slot { position: absolute; left: 0; right: 0; border-radius: 7px; padding: 0 4px; overflow: hidden; display: flex; flex-direction: column; justify-content: center; line-height: 1.12; color: var(--on-key); }
.slot b { font-family: var(--f-display); font-weight: 400; font-size: 14px; white-space: nowrap; }
.slot i { font-style: normal; font-size: 9px; font-weight: 800; opacity: .75; white-space: nowrap; }
.slot u { text-decoration: none; font-size: 9px; font-weight: 800; white-space: nowrap; }
.slot.g1 { background: var(--info); } .slot.g2 { background: var(--hr); } .slot.g3 { background: var(--act); }
.slot.free { border: 1.5px dashed #3B4778; color: var(--ink-2); background: rgba(255, 255, 255, .03); }
.slot.lunch { background: rgba(255, 213, 74, .16); color: var(--chalk); }
.slot.after { border: 1.5px dashed #3B4778; color: var(--ink-2); }
.slot.leave { background: repeating-linear-gradient(45deg, rgba(255, 92, 108, .22) 0 5px, transparent 5px 10px); color: var(--hot); border: 1.5px solid rgba(255, 92, 108, .5); }
.slot.past { opacity: .4; }
.slot.cur { box-shadow: 0 0 0 2.5px var(--chalk), 0 0 14px rgba(255, 213, 74, .55); opacity: 1; }
.slot.next { box-shadow: 0 0 0 1.5px var(--chalk); }
.slot .bd { position: absolute; top: 2px; right: 2px; font-size: 9px; font-weight: 800; border-radius: 5px; padding: 0 3px; background: #12152A; }
.slot .bd.ok { color: var(--act); } .slot .bd.late { color: var(--hr); } .slot .bd.miss { color: var(--hot); }
.slot .go { color: #12152A; background: var(--chalk); border-radius: 4px; padding: 0 3px; margin-top: 1px; align-self: flex-start; animation: blink 1s infinite; }
.slot.free .go, .slot.after .go { color: #12152A; }
.veil { position: absolute; left: -8px; right: -6px; top: 0; background: rgba(14, 18, 38, .5); pointer-events: none; }
.needle { position: absolute; left: -10px; right: -6px; height: 2px; background: var(--hot); box-shadow: 0 0 8px var(--hot); pointer-events: none; }
.needle::before { content: ""; position: absolute; left: -2px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--hot); }
.mk { position: absolute; left: -12px; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; }
.mk.msg { background: var(--info); } .mk.msg.unread { background: var(--hot); box-shadow: 0 0 6px var(--hot); }
.mk.due { left: auto; right: -6px; width: 0; height: 0; border-radius: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-right: 7px solid var(--hot); }
.hr { position: absolute; left: -14px; font-size: 8.5px; color: #59648E; transform: translateY(-50%); font-weight: 800; pointer-events: none; }
.side .nxt { margin: 0 6px 8px; border-radius: 10px; background: #1F2645; border: 1px solid var(--line); padding: 6px 5px; text-align: center; font-size: 10px; font-weight: 800; color: var(--ink-2); line-height: 1.35; cursor: pointer; font-family: var(--f-body); }
.side .nxt b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 15px; color: var(--ink); }
.side .nxt em { font-style: normal; color: var(--chalk); }
.side .nxt.hot { border-color: var(--hot); } .side .nxt.hot em { color: var(--hot); }
/* 직업별 캠페인 · 업무포털 · 퀘스트 */
.slot.gs { background: #B48CFF; } .tt td.gs { background: #B48CFF; }
.slot.sports, .slot.trip { background: repeating-linear-gradient(45deg, rgba(79, 214, 156, .35) 0 6px, rgba(79, 214, 156, .15) 6px 12px); color: var(--act); border: 1.5px solid rgba(79, 214, 156, .6); }
.slot .swp { font-style: normal; background: #12152A; color: var(--chalk); border-radius: 3px; padding: 0 2px; }
.mk.duty { left: auto; right: -9px; width: 12px; height: 12px; border-radius: 0; font-size: 10px; line-height: 12px; color: var(--chalk); text-align: center; }
.mk.duty.done { color: var(--act); }
.side .wk span { color: var(--ink-2); }
.tt td.ev { background: repeating-linear-gradient(45deg, rgba(255, 92, 108, .2) 0 4px, transparent 4px 8px); color: var(--hot); font-weight: 800; font-size: 10.5px; }
.tt td.sw { outline: 2px dashed var(--chalk); outline-offset: -3px; }
.panel .tt td.ev { color: #C62828; }
.panel.portal { background: #EEF1F7; }
.portal .ph { background: #1B2550; }
.ptabs { display: flex; gap: 0; background: #27305A; padding: 0 4px; overflow-x: auto; scrollbar-width: none; flex: none; }
.ptabs::-webkit-scrollbar { display: none; }
.ptabs button { flex: none; background: none; border: 0; color: #B9C0DA; font-weight: 800; font-size: 12.5px; padding: 8px 9px 6px; cursor: pointer; border-bottom: 3px solid transparent; font-family: var(--f-body); }
.ptabs button.on { color: #fff; border-bottom-color: #FFD54A; }
.ptabs button i { font-style: normal; background: #FF5C6C; color: #fff; border-radius: 8px; padding: 0 5px; font-size: 10px; margin-left: 3px; }
.mywork, .notice { margin: 10px 10px 0; background: #fff; border: 1px solid #C9D3E3; border-radius: 12px; padding: 9px 10px; }
.mywork h5, .notice h5 { margin: 0 0 7px; font-size: 13px; color: #1B2340; display: flex; justify-content: space-between; gap: 6px; }
.mywork h5 span { font-size: 11px; color: #6A7393; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mw4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.mw4 button { background: #F4F6FA; border: 1px solid #DDE3EE; border-radius: 10px; padding: 7px 2px 6px; font-size: 11px; font-weight: 800; color: #4A5675; cursor: pointer; font-family: var(--f-body); }
.mw4 button b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 22px; color: #1F4E9C; line-height: 1.1; }
.mw4 button.hot { border-color: #FFB3BC; background: #FFF1F3; } .mw4 button.hot b { color: #C62828; }
.mwl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 12px; margin-top: 7px; font-size: 11.5px; font-weight: 700; color: #4A5675; }
.mwl span { display: flex; justify-content: space-between; border-bottom: 1px dashed #DDE3EE; padding: 3px 0; }
.mwl b { color: #1B2340; }
.notice div { padding: 4px 0; border-bottom: 1px solid #EEF2F8; color: #1B2340; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.notice div:last-child { border-bottom: 0; }
.pintro { margin: 10px 10px 0; padding: 8px 10px; border-radius: 10px; color: #fff; font-size: 12px; font-weight: 800; background: #27305A; }
.pintro.sys-neis { background: #1F4E9C; } .pintro.sys-edufine { background: #0E7C66; } .pintro.sys-edoc { background: #4A3F8C; } .pintro.sys-agg { background: #8C5A1F; } .pintro.sys-msgr { background: #1F7A8C; }
.cat.gong { background: #8C5A1F; }
.row.gong { background: #FFF3E0; border-color: #E8B36A; }
.sys.edoc .ph { background: #4A3F8C; } .sys.agg .ph { background: #8C5A1F; } .sys.msgr .ph { background: #1F7A8C; }
.neis { margin: 8px 12px 4px; border: 1px solid #9FB3D6; border-radius: 8px; overflow: hidden; background: #fff; font-size: 11px; }
.neis .nb { display: flex; align-items: center; gap: 6px; background: #163A78; color: #fff; padding: 5px 8px; }
.neis.fin .nb { background: #0B5E4E; }
.neis .nb b { font-family: var(--f-display); font-weight: 400; font-size: 14px; letter-spacing: .5px; flex: none; }
.neis .nb span { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.neis .nb em { font-style: normal; white-space: nowrap; padding: 2px 5px; border-radius: 4px; opacity: .65; font-weight: 700; }
.neis .nb em.on { background: #FFD54A; color: #12152A; opacity: 1; font-weight: 800; }
.neis .nq { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; padding: 5px 8px; background: #EEF3FB; border-bottom: 1px solid #C9D3E3; color: #4A5675; font-weight: 700; }
.neis .nq i { font-style: normal; display: inline-block; min-width: 24px; padding: 0 4px; margin-left: 2px; background: #fff; border: 1px solid #AEBBD2; border-radius: 3px; color: #1B2340; }
.nqb { margin-left: auto; background: #1F4E9C; color: #fff; border-radius: 4px; padding: 1px 10px; }
.ng { width: 100%; border-collapse: collapse; font-size: 11px; }
.ng th { background: #DDE6F4; color: #4A5675; border: 1px solid #C9D3E3; padding: 3px 5px; font-weight: 800; }
.ng td { border: 1px solid #E1E7F0; padding: 3px 5px; color: #1B2340; text-align: center; }
.ng tr.hl td { background: #FFF6C4; font-weight: 800; }
.edoc { margin: 8px 12px 4px; background: #fff; border: 1px solid #C2BBE3; border-radius: 8px; padding: 6px 8px; font-size: 11px; color: #4A5675; }
.edoc .eh { display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; font-weight: 700; }
.edoc .eh b { color: #1B2340; }
.edoc .sl { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 6px; border: 1px solid #C2BBE3; }
.edoc .sl div { border-left: 1px solid #C2BBE3; text-align: center; } .edoc .sl div:first-child { border-left: 0; }
.edoc .sl i { display: block; font-style: normal; background: #EEEBFA; font-weight: 800; padding: 2px 0; }
.edoc .sl b { display: block; height: 26px; line-height: 26px; color: #B9C0DA; }
.edoc .sl b.st { color: #D23B2E; font-family: var(--f-display); font-weight: 400; font-size: 15px; }
.msgr { margin: 8px 12px 4px; background: #fff; border: 1px solid #9CCAD6; border-radius: 10px; overflow: hidden; font-size: 12px; }
.msgr .mh { background: #1F7A8C; color: #fff; font-weight: 800; padding: 5px 9px; display: flex; justify-content: space-between; }
.msgr .ml { display: flex; gap: 8px; padding: 5px 9px; border-bottom: 1px solid #E3EEF2; color: #1B2340; font-weight: 700; }
.msgr .ml i { font-style: normal; color: #6A7393; min-width: 52px; }
.msgr .mbd { padding: 8px 9px; min-height: 44px; color: #1B2340; border-bottom: 1px solid #E3EEF2; }
.msgr u { text-decoration: none; color: #B7C1D6; }
.agg { margin: 8px 12px 4px; background: #fff; border: 1px solid #E0C39A; border-radius: 8px; overflow: hidden; }
.agg .ah { background: #8C5A1F; color: #fff; font-size: 12px; font-weight: 800; padding: 5px 8px; display: flex; justify-content: space-between; }
.panel .info { margin: 6px 12px 0; padding: 7px 10px; border-radius: 8px; background: #E8F1FF; border: 1px dashed #6D8FC9; font-size: 12.5px; font-weight: 700; color: #1B2340; }
.sheet .who { font-family: var(--f-display); font-size: 17px; color: #1B2340; line-height: 1.25; }
.sheet .who small { font-family: var(--f-body); font-size: 11.5px; color: #6A7393; font-weight: 700; }
.kids { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.kid { background: #fff; border: 1px solid #C9D3E3; border-radius: 10px; padding: 7px 8px; font-size: 11px; color: #1B2340; }
.kid b { font-size: 13px; } .kid em { font-style: normal; margin-left: 5px; background: #FFE9EC; color: #C62828; border-radius: 5px; padding: 0 4px; font-weight: 800; font-size: 10.5px; }
.kid small { display: block; color: #6A7393; font-weight: 700; margin: 2px 0 4px; }
.kid .ks { display: grid; gap: 2px; }
.kid .ks span { display: grid; grid-template-columns: 26px 1fr; align-items: center; gap: 4px; font-weight: 800; color: #4A5675; font-size: 10px; }
.mb { display: block; height: 6px; background: #EEF2F8; border-radius: 3px; overflow: hidden; } .mb i { display: block; height: 100%; }
.quest { position: absolute; z-index: 4; display: flex; flex-direction: column; gap: 3px; }
.quest .qh { font-family: var(--f-display); font-size: 12px; color: var(--chalk); text-shadow: 0 1px 3px #000; padding: 0 3px; }
.quest .qh b { font-weight: 400; background: var(--hot); color: #fff; border-radius: 7px; padding: 0 5px; }
.quest button { display: flex; gap: 5px; align-items: flex-start; text-align: left; width: 100%; background: rgba(10, 14, 30, .8); border: 1px solid rgba(90, 111, 176, .7); border-radius: 8px; padding: 4px 6px; color: #fff; font-size: 11px; font-weight: 800; cursor: pointer; font-family: var(--f-body); line-height: 1.25; }
.quest button i { flex: none; width: 7px; height: 7px; border-radius: 4px; margin-top: 4px; }
.quest button span { min-width: 0; display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.quest small { display: block; font-size: 9.5px; color: #B9C0DA; font-weight: 700; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.quest button.hot { border-color: rgba(255, 92, 108, .8); } .quest button.hot small { color: #FF9AA5; }
.quest button.new { border-color: var(--chalk); animation: qnew 1s ease-out 3; }
@keyframes qnew { 0% { transform: translateX(24px); opacity: 0; background: rgba(255, 213, 74, .9); } 45% { transform: none; opacity: 1; background: rgba(255, 213, 74, .45); } 100% { background: rgba(10, 14, 30, .8); } }
.gsel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 8px; }
.gsel button, .rsel button { border: 2px solid var(--line); background: #1A2040; color: var(--ink); border-radius: 12px; padding: 8px 4px; font-weight: 800; font-size: 14px; cursor: pointer; font-family: var(--f-body); min-width: 0; }
.gsel button.on, .rsel button.on { border-color: var(--chalk); background: #3A3420; color: var(--chalk); }
.rsel { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.rsel button b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 19px; line-height: 1.1; }
.rsel button small { display: block; font-size: 10px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rsel button.sp b { color: #C9A8FF; } .rsel button.sp.on b { color: var(--chalk); }
.rdesc { margin: 8px 0 0; text-align: left; background: #1A2040; border-radius: 12px; padding: 9px 11px; font-size: 12.5px; line-height: 1.5; color: var(--ink); }
.rdesc span { color: var(--ink-2); font-size: 11.5px; }
.brief { text-align: left; margin: 10px 0 4px; display: grid; gap: 4px; }
.brief div { background: #1A2040; border-radius: 8px; padding: 6px 9px; font-size: 12.5px; font-weight: 700; line-height: 1.35; }
.kmood { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; margin: 8px 0 0; font-size: 20px; }
.kmood span { display: grid; justify-items: center; } .kmood small { font-size: 10px; color: var(--ink-2); }
@media (prefers-reduced-motion: reduce) { .quest button.new { animation: none; } }
.panel .tt th, .panel .tt td { border-color: #C9D3E3; color: #1B2340; }
.panel .tt td.c { color: #12152A; } .panel .tt th { background: #EEF2F8; color: #4A5675; } .panel .tt th.today { background: #FFF6C4; color: #1B2340; }
.panel .tt td.lv { color: #C62828; }
.panel .ttwrap { padding: 4px 10px 12px; }
@media (min-width: 520px) { .game { box-shadow: 0 0 0 1px var(--line), 0 30px 80px rgba(0, 0, 0, .5); } }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
button { font-family: inherit; }

.top { display: flex; gap: 3px; justify-content: center; margin-top: 6px; }
.ib { width: 24px; height: 24px; border-radius: 7px; border: 1px solid var(--line); background: #1F2645; color: var(--ink); font-size: 11px; cursor: pointer; display: grid; place-items: center; padding: 0; }
@media (min-width: 520px) { .ib { width: 30px; height: 28px; font-size: 13px; } }
.side .home { display: inline-block; font-size: 9.5px; font-weight: 800; color: #12152A; background: var(--hr); border-radius: 5px; padding: 0 5px; margin: 2px 0 1px; }
.side .wk { font-size: 9.5px; font-weight: 800; color: var(--hot); line-height: 1.3; }
.ib:focus-visible, .key:focus-visible, .btn:focus-visible, .abtn:focus-visible, .panel button:focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; }

.abtn { position: absolute; right: 16px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 84px; height: 84px; border-radius: 50%; border: 0; background: var(--chalk); color: var(--on-key); z-index: 5; box-shadow: 0 6px 0 #9B6B00, 0 10px 30px rgba(0, 0, 0, .4); display: grid; place-items: center; align-content: center; cursor: pointer; touch-action: none; }
.abtn b { font-family: var(--f-display); font-size: 30px; font-weight: 400; line-height: 1; }
.abtn span { font-size: 11px; font-weight: 800; max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dbtn { position: absolute; right: 26px; bottom: calc(120px + env(safe-area-inset-bottom, 0px)); width: 66px; height: 66px; border-radius: 50%; border: 0; background: var(--hot); color: #fff; z-index: 5; box-shadow: 0 5px 0 #9B2A36, 0 8px 24px rgba(255, 92, 108, .4); display: grid; place-items: center; align-content: center; cursor: pointer; touch-action: none; }
.dbtn b { font-size: 24px; line-height: 1; }
.dbtn span { font-size: 10.5px; font-weight: 800; }
.dbtn.cd { background: #4A3A58; box-shadow: 0 5px 0 #2A2238; }
.dbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 #9B2A36; }
.abtn.off { background: #3A4470; color: var(--ink-2); box-shadow: 0 6px 0 #232A4C; }
.abtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #9B6B00; }

.pad { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 1fr 1.08fr 1fr; gap: 8px; padding: 8px 10px calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
.key { height: 62px; border-radius: 16px; border: 0; color: var(--on-key); cursor: pointer; display: grid; place-items: center; align-content: center; box-shadow: 0 5px 0 rgba(0, 0, 0, .38); font-family: var(--f-display); touch-action: none; }
.key b { font-size: 21px; line-height: 1.05; font-weight: 400; }
.key span { font-family: var(--f-body); font-weight: 800; font-size: 11px; opacity: .8; }
.key.l { background: var(--info); } .key.u { background: var(--hot); } .key.r { background: var(--act); }
.key:active, .key.hit { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0, 0, 0, .38); }

/* 대화창 (RPG 텍스트 박스) */

  let items = src.map((it) => (typeof it === 'string' ? null : { t: String(it.t ?? it.text ?? it.q ?? ''), sub: it.sub, tip: it.tip, k: dirOf(it.k ?? it.lane ?? it.cat ?? it.c) })).filter((x) => x && x.t && x.k);
  if (items.length < 4) items = [
    { t: '근접발달영역', sub: 'ZPD', k: 'left' }, { t: '비고츠키', sub: '사회문화이론', k: 'up' }, { t: '모둠 안 또래 도움', sub: '수업 장면', k: 'right' },
    { t: '자기효능감', k: 'left' }, { t: '반두라', k: 'up' }, { t: '시범 보이고 따라 하기', k: 'right' },
    { t: '잠재적 교육과정', k: 'left' }, { t: '잭슨', k: 'up' }, { t: '줄 서기 · 기다리기 습관', k: 'right' },
  ];
  items = E.shuffle(items.slice()).slice(0, opts.count || 9);
  const tips = {}; IM_MN_DIRS.forEach((d, i) => { tips[d] = `${lanes[i]} 카드는 ${IM_MN_ARW[d]}`; });
  const m = E.sortMini({
    title: opts.title || '암기 카드 분류!', sub: opts.sub || `${lanes[0]} ← · ${lanes[1]} ↑ · ${lanes[2]} →`, items,
    pad: lanes.map((l, i) => imMnPadLab(IM_MN_DIRS[i], l, '분류')), tips, showColor: true, bpm: opts.bpm || 116, gap: 2.2, fall: 5.2, missHurt: 1.5, wrongHurt: 1.5, style: 'focus',
    missText: '카드를 놓쳤어요', bg: (mm, b, now) => imMnBG(E, opts.bg || 'reading', mm, b, now),
    onEnd: (mm) => fin(mm.notes.length ? mm.right / mm.notes.length : 1, mm),
  });
  m.lanes = lanes;
  const draw0 = m.draw;
  m.draw = function (st, b, now) {
    draw0.call(this, st, b, now);
    const g = E.g, VW = E.VW, dy = this.deskY(), n = this.notes.length, doneN = this.right + this.wrongs + this.missed;
    imMnHead(E, `${opts.title || '암기 카드'} · ${doneN}/${n}`, n ? doneN / n : 0, E.C.info, `정답 ${this.right}`);
    lanes.forEach((l, i) => {
      const x = [44, VW / 2, VW - 44][i], col = this.COL[IM_MN_DIRS[i]];
      g.fillStyle = 'rgba(15,18,36,.75)'; E.rr(x - 40, dy + 4, 80, 26, 9); g.fill();
      g.fillStyle = col; g.textAlign = 'center'; const lb = `${IM_MN_ARW[IM_MN_DIRS[i]]} ${l}`; E.fitText(lb, 72, 14, E.FD); g.fillText(lb, x, dy + 22);
    });
  };
  m.auto = function () { const a = this.active(); if (a && a.y > 120) this.input(a.src.k, E.clockNow()); };
  return m;
}

/* =====================================================================
   3. 기출 퀴즈 — 6초 3지선다 연속 (formMini 퀴즈 모드)
   ===================================================================== */
function imQuizMini(E, opts = {}) {
  const fin = imMnFin(E, opts), track = imMnTrack(opts.track), count = opts.count || 5, time = opts.time || 6;
  const qs = imMnQs(E, opts.qs, track, count);
  const steps = qs.map((x) => ({ ask: x.q, ans: x.a, opts: x.w.slice(0, 2), why: `정답: ${x.a}${x.tip ? ' · ' + x.tip : ''}`, one: Math.max(x.a.length, ...x.w.map((w) => w.length)) > 11 }));
  const m = E.formMini({
    quiz: true, title: opts.title || '기출 퀴즈', sub: opts.sub || `문항당 ${time}초`, goal: `${steps.length}문제 · 3지선다`, time, color: '#2E3F86', hurt: 1, pass: 0.6,
    banner: opts.title || '기출 퀴즈!', bannerSub: `${steps.length}문제 · 문항당 ${time}초`, bg: (mm, b, now) => imMnBG(E, opts.bg || 'reading', mm, b, now), steps,
  }, { forced: false, later: false, onEnd: (ok, mm) => fin(mm.score, mm) });
  m.auto = function () { imMnFormAuto(this); };

}

/* =====================================================================
   4. 논술 뼈대 — 서론 → 본론 4 → 결론 슬롯마다 맞는 키워드를 3개 중 고르기 → 개요 카드
   prompt = IM_ESSAY 항목 { topic, intro, points[4], decoys[3], concl } | 주제 문자열 | 없음
   ===================================================================== */
function imEssayMini(E, opts = {}) {
  const fin = imMnFin(E, opts), C = E.C;
  let P = opts.prompt;
  const ES = typeof IM_ESSAY !== 'undefined' ? IM_ESSAY : null;
  const list = ES ? (Array.isArray(ES) ? ES : Object.values(ES)) : [];
  if (typeof P === 'string') P = list.find((x) => x && (x.topic === P || x.id === P)) || Object.assign({}, IM_MN_ESSAY, { topic: P });
  if (!P || typeof P !== 'object' || !Array.isArray(P.points)) P = list.length ? E.rnd(list) : IM_MN_ESSAY;
  const decoys = (P.decoys && P.decoys.length ? P.decoys : IM_MN_ESSAY.decoys).map(String);
  // 서론·결론은 구조 선택(일반 원칙), 본론은 논점 키워드 vs 함정(decoys)
  const concl = P.concl && String(P.concl).length <= 44 ? String(P.concl) : '논점 요약 · 교사로서의 다짐';
  const slots = [{ label: '서론', ans: '문제 상황 제시 · 논점 예고', gen: ['개인 경험담 길게 나열', '결론부터 길게 쓰기'] }]
    .concat((P.points || []).slice(0, 4).map((p, i) => ({ label: '본론 ' + ['①', '②', '③', '④'][i], ans: String(p) })))
    .concat([{ label: '결론', ans: concl, gen: ['새로운 주장 추가 제시', '본론 문장 그대로 반복'] }]);
  const dpool = E.shuffle(decoys.slice());
  const items = slots.map((s, i) => {
    const wr = s.gen ? s.gen.slice() : [dpool[i % dpool.length] || '관련 없는 예시', dpool[(i + 1) % dpool.length] || '근거 없는 주장'];
    if (wr[0] === wr[1] || wr.includes(s.ans)) wr[1] = '근거 없는 주장';
    const o = E.shuffle([s.ans, wr[0], wr[1]]);
    return { q: s.label, opts: o, ans: o.indexOf(s.ans), tip: s.ans, label: s.label };
  });
  const m = imMnChoiceMini(E, {
    fin, title: '논술 뼈대', banner: '교육학 논술 뼈대!', bannerSub: '서론 → 본론 4 → 결론 · 맞는 키워드를 ←↑→', bg: opts.bg || 'exam', style: 'focus', bpm: 92, items, time: opts.time || 5.5, reveal: true, endHold: 3.4,
    scene: { board: '교육학 논술 · 60분' },
    padLabel: (it, k, d) => [`${IM_MN_ARW[d]} ${IM_MN_NUM[k]}`, imMnShort(it.opts[k].replace(/^[^:]*:\s*/, ''), 8)],
    drawBody(mm) {
      const g = E.g, VW = E.VW, top = 98, bot = mm.cardsTop ? mm.cardsTop - 12 : E.VH * 0.6;
      g.font = `700 12px ${E.FB}`; const nTop = E.wrapText(P.topic.length > 24 || !P.intro ? P.topic : P.intro, VW - 52, g.font, 3).length;
      const avail = Math.min(bot - top, 54 + nTop * 15 + slots.length * 50);
      imMnPaper(E, 12, top, VW - 24, avail, '#FFFDF4', 8);
      g.fillStyle = '#C62828'; g.fillRect(12, top, VW - 24, 4);
      g.fillStyle = '#1B2340'; g.font = `14px ${E.FD}`; g.textAlign = 'left'; g.fillText('교육학 논술 답안지 · 개요', 24, top + 22);
      if (P.topic.length <= 24) { g.fillStyle = '#C62828'; g.textAlign = 'right'; E.fitText('논제: ' + P.topic, VW * 0.5, 13, E.FD); g.fillText('논제: ' + P.topic, VW - 22, top + 22); g.textAlign = 'left'; }
      g.font = `700 12px ${E.FB}`; const tl = E.wrapText(P.topic.length > 24 || !P.intro ? P.topic : P.intro, VW - 52, g.font, 3); imMnTextLines(E, tl, 24, top + 40, 15, '#4A5675');
      const y0 = top + 46 + tl.length * 15, rh = E.clamp((avail - (y0 - top) - 8) / slots.length, 26, 54);
      slots.forEach((s, k) => {
        const y = y0 + k * rh, cur = k === mm.i && mm.phase !== 'end';
        if (cur) { g.fillStyle = 'rgba(255,213,74,.35)'; g.fillRect(16, y, VW - 32, rh - 3); }
        g.strokeStyle = '#D8DEEA'; g.lineWidth = 1; g.beginPath(); g.moveTo(18, y + rh - 2); g.lineTo(VW - 18, y + rh - 2); g.stroke();
        g.fillStyle = k === 0 || k === slots.length - 1 ? '#1F4E9C' : '#2E7D5B'; g.font = `13px ${E.FD}`; g.textAlign = 'left'; g.fillText(s.label, 22, y + rh / 2 + 4);
        const p = mm.picks[k];
        let t = cur ? '?' : '', col = '#1B2340';
        if (p != null) { t = p >= 0 ? items[k].opts[p] : '(공란)'; col = mm.oks[k] ? '#1F7A4D' : '#C62828'; }
        g.fillStyle = col; g.font = `800 13px ${E.FB}`;
        const tlines = E.wrapText(t, VW - 120, g.font, rh >= 40 ? 2 : 1);
        imMnTextLines(E, tlines, 82, y + rh / 2 + 5 - (tlines.length - 1) * 8, 16, col);
        if (p != null) { g.font = `15px ${E.FD}`; g.textAlign = 'right'; g.fillText(mm.oks[k] ? '○' : '✗', VW - 24, y + rh / 2 + 5); }
      });
    },
    drawEnd(mm, k) {
      const g = E.g, VW = E.VW, VH = E.VH;
      g.globalAlpha = k; g.fillStyle = 'rgba(10,12,24,.6)'; g.fillRect(0, 0, VW, VH);
      const w = VW - 36, x = 18, y = 104, h = Math.min(VH - E.padV - 120, 150 + slots.length * 52);
      imMnPaper(E, x, y, w, h, '#FFFDF4', 14);
      g.fillStyle = '#1B2340'; g.font = `20px ${E.FD}`; g.textAlign = 'center'; g.fillText('완성된 답안 개요', VW / 2, y + 32);
      g.font = `13px ${E.FB}`; g.fillStyle = '#4A5675'; g.fillText(`구조 점수 ${mm.right}/${slots.length}`, VW / 2, y + 52);
      slots.forEach((s, i) => {
        const yy = y + 76 + i * 52;
        g.textAlign = 'left'; g.font = `13px ${E.FD}`; g.fillStyle = mm.oks[i] ? '#1F7A4D' : '#C62828'; g.fillText(`${mm.oks[i] ? '✔' : '✎'} ${s.label}`, x + 14, yy);
        g.font = `800 12.5px ${E.FB}`; const line = mm.oks[i] ? s.ans : `${s.ans} (다시 외우기)`;
        imMnTextLines(E, E.wrapText(line, w - 44, g.font, 2), x + 28, yy + 18, 15, '#1B2340');
      });
      g.globalAlpha = 1;
      if (mm.right === slots.length) imMnStamp(E, '뼈대 완벽', VW / 2, y + h + 26, k, '#1F7A4D');
      else if (mm.right >= slots.length - 2) imMnStamp(E, '거의 완성', VW / 2, y + h + 26, k, '#1F4E9C');
    },
  });
  m.prompt = P; m.slots = slots;
  return m;
}

/* =====================================================================
   5. 모의고사 — 8~10문항 · 전체 제한시간(minutes → 실제 약 40초) · OMR 카드 · 성적표(점수 · 등수)
   ===================================================================== */
function imMockMini(E, opts = {}) {
  const fin = imMnFin(E, opts), C = E.C, track = imMnTrack(opts.track);
  const minutes = opts.minutes || 60, total = opts.seconds || E.clamp(25 + minutes * 0.12, 30, 45);
  let qs = imMnQs(E, opts.qs, track);
  const n = E.clamp(opts.count || 10, 1, Math.max(1, qs.length));
  qs = qs.slice(0, n);
  const items = qs.map((x) => { const o = E.shuffle([x.a, x.w[0], x.w[1]]); return { q: x.q, opts: o, ans: o.indexOf(x.a), tip: x.tip }; });
  const N = opts.people || 342, title = opts.title || '월례 모의고사';
  const m = imMnChoiceMini(E, {
    fin, title, banner: title, bannerSub: `${items.length}문항 · ${minutes}분 (실제 ${Math.round(total)}초) · OMR 마킹`, bg: opts.bg || 'exam', style: 'tense', bpm: 100, items, total, neutral: true, endHold: 4,
    scene: { board: title }, timeUpText: '시험 종료! 펜 내려놓으세요',
    headText: (mm) => `${title} · ${Math.min(mm.i + 1, items.length)}/${items.length}`,
    headFrac: (mm, st) => (mm.phase === 'end' ? 0 : 1 - (st - mm.g0) / total),
    headRight: (mm, st) => { const left = Math.max(0, (1 - (st - mm.g0) / total) * minutes * 60); return mm.phase === 'end' ? '종료' : `남은 ${E.p2(Math.floor(left / 60))}:${E.p2(Math.floor(left % 60))}`; },
    score: (mm) => mm.right / items.length,
    onEndPhase(mm) {
      mm.acc = mm.right / items.length; mm.score = Math.round(mm.acc * 100);
      mm.total = N; mm.rank = E.clamp(Math.round(N * (0.03 + 0.92 * Math.pow(1 - mm.acc, 1.15))), 1, N);
      E.sfx.stamp(); E.setPad(null);
    },
    drawBody(mm) {
      const g = E.g, VW = E.VW;
      // OMR 카드
      const cols = 2, rows = Math.ceil(items.length / cols), ox = 12, oy = 98, ow = VW - 24, oh = 30 + rows * 17 + 6;
      imMnPaper(E, ox, oy, ow, oh, '#FDE7EA', 8);
      g.strokeStyle = '#D8434F'; g.lineWidth = 2; E.rr(ox + 3, oy + 3, ow - 6, oh - 6, 6); g.stroke();
      g.fillStyle = '#B0303C'; g.font = `12px ${E.FD}`; g.textAlign = 'left'; g.fillText('OMR 답안지 · 수험번호 2027-0■■■', ox + 12, oy + 20);
      g.textAlign = 'right'; g.fillText('컴퓨터용 사인펜', ox + ow - 12, oy + 20);
      const cw = (ow - 20) / cols;
      items.forEach((it, k) => {
        const c = Math.floor(k / rows), r = k % rows, x = ox + 10 + c * cw, y = oy + 34 + r * 17;
        if (k === mm.i && mm.phase !== 'end') { g.fillStyle = 'rgba(255,213,74,.55)'; g.fillRect(x, y - 7, cw - 6, 15); }
        g.fillStyle = '#B0303C'; g.font = `11px ${E.FD}`; g.textAlign = 'right'; g.fillText(String(k + 1), x + 18, y + 4);
        for (let o = 0; o < 3; o++) {
          const bx = x + 34 + o * 26, filled = mm.picks[k] === o;
          g.strokeStyle = '#D8434F'; g.lineWidth = 1.2; g.beginPath(); g.ellipse(bx, y, 8, 6, 0, 0, 7); g.stroke();
          if (filled) { g.fillStyle = '#1A1A1A'; g.beginPath(); g.ellipse(bx, y, 8, 6, 0, 0, 7); g.fill(); }
          else { g.fillStyle = '#D8434F'; g.font = `9px ${E.FB}`; g.textAlign = 'center'; g.fillText(String(o + 1), bx, y + 3); }
        }
        if (mm.phase === 'end') { g.fillStyle = mm.oks[k] ? '#1F7A4D' : '#C62828'; g.font = `13px ${E.FD}`; g.textAlign = 'left'; g.fillText(mm.oks[k] ? '○' : '✗', x + 34 + 3 * 26 - 6, y + 4); }
      });
      // 문제지
      const it = mm.cur(); if (!it || mm.phase === 'end') return;
      const py = oy + oh + 10, room = Math.max(60, (mm.cardsTop || E.VH * 0.62) - 12 - py);
      g.font = `18px ${E.FD}`; const ql = E.wrapText(it.q, VW - 56, g.font, Math.max(1, Math.floor((room - 50) / 24)));
      const ph = Math.min(room, 64 + ql.length * 24);
      imMnPaper(E, 12, py, VW - 24, ph, '#FFFFFF', 6);
      g.fillStyle = '#1B2340'; g.font = `15px ${E.FD}`; g.textAlign = 'left'; g.fillText(`문 ${mm.i + 1}.`, 24, py + 24);
      g.fillStyle = '#8A93AD'; g.font = `11px ${E.FB}`; g.textAlign = 'right'; g.fillText('[2점]', VW - 24, py + 24);
      g.font = `18px ${E.FD}`; imMnTextLines(E, ql, 24, py + 52, 24, '#1B2340');
      // 시계 · 감독관 한마디
      const cy2 = py + ph + 46;
      if (cy2 + 40 < (mm.cardsTop || E.VH)) {
        const st2 = E.clockNow() - mm.t0, left = 1 - (st2 - mm.g0) / total;
        g.fillStyle = '#FFFDF4'; g.beginPath(); g.arc(VW / 2, cy2, 30, 0, 7); g.fill(); g.strokeStyle = '#1B2340'; g.lineWidth = 3; g.stroke();
        const a = -Math.PI / 2 + (1 - left) * Math.PI * 2; g.beginPath(); g.moveTo(VW / 2, cy2); g.lineTo(VW / 2 + Math.cos(a) * 22, cy2 + Math.sin(a) * 22); g.stroke();
        if (left < 0.25) { g.fillStyle = C.hot; g.font = `14px ${E.FD}`; g.textAlign = 'center'; g.fillText('감독관: 종료 10분 전입니다', VW / 2, cy2 + 52); }
      }
    },
    drawEnd(mm, k) {
      const g = E.g, VW = E.VW, VH = E.VH;
      g.globalAlpha = k; g.fillStyle = 'rgba(10,12,24,.55)'; g.fillRect(0, 0, VW, VH);
      const w = VW - 60, x = 30, y = Math.max(240, VH * 0.3), h = 220;
      imMnPaper(E, x, y, w, h, '#FFFDF4', 14);
      g.fillStyle = '#2E3F86'; E.rr(x, y, w, 40, 14); g.fill(); g.fillRect(x, y + 26, w, 14);
      g.fillStyle = '#fff'; g.font = `17px ${E.FD}`; g.textAlign = 'center'; g.fillText(`${title} 성적표`, VW / 2, y + 27);
      g.fillStyle = '#1B2340'; g.font = `46px ${E.FD}`; g.fillText(`${mm.score}점`, VW / 2, y + 98);
      g.fillStyle = '#C62828'; g.font = `20px ${E.FD}`; g.fillText(`${mm.total}명 중 ${mm.rank}등`, VW / 2, y + 132);
      g.fillStyle = '#4A5675'; g.font = `800 12.5px ${E.FB}`; g.fillText(`정답 ${mm.right}/${items.length} · 상위 ${Math.max(1, Math.round(mm.rank / mm.total * 100))}%`, VW / 2, y + 158);
      const msg = mm.acc >= 0.8 ? '이 페이스 그대로! 컨디션 관리만 하자' : mm.acc >= 0.6 ? '오답 노트가 곧 점수다' : '모의고사는 연습일 뿐. 틀린 만큼 배웠다';
      g.fillStyle = '#1F4E9C'; E.fitText(msg, w - 24, 14, E.FD); g.fillText(msg, VW / 2, y + 190);
      g.globalAlpha = 1;
    },
  });
  m.score = 0; m.rank = N; m.total = N; m.acc = 0; m.minutes = minutes;
  return m;
}

/* =====================================================================
   6. 요약노트 제본 — 탭 리듬으로 페이지 넘기기 → '제본 완료' 도장 (tapMini)
   ===================================================================== */
function imBindMini(E, opts = {}) {
  const fin = imMnFin(E, opts), C = E.C, n = E.clamp(opts.pages || 8, 4, 14), step = n > 10 ? 0.75 : 1;
  const taps = Array.from({ length: n }, (_, i) => 4 + i * step), lastB = taps[n - 1];
  const m = E.tapMini({
    title: opts.title || '요약노트 제본!', sub: `↑ 박자에 맞춰 ${n}장 넘기기`, who: '인쇄소 사장님', face: 'calm', taps, dir: 'up', tapText: '넘김', padLabel: ['↑ 넘김', '박자에 맞춰'], hitText: '착!', perfectText: '착착!',
    bpm: opts.bpm || 104, style: 'focus', ring: false, end: lastB + 4, bg: 'print',
    onTap: (j, mm) => { E.sfx.page(); },
    onEnd: (mm) => fin(mm.hits / n, mm),
  });
  m.pages = n; m.stampAt = lastB + 1;
  m.draw = function (st, b, now) {
    const g = E.g, VW = E.VW, VH = E.VH;
    imMnBG(E, 'print', this, b, now);
    imMnHead(E, `요약노트 제본 · ${this.hits}/${n}장`, (b - 4) / (lastB - 3), C.chalk, `정확도 ${Math.round((this.hits / n) * 100)}%`);
    if (b < 3.6) E.bubble(VW / 2, 170, '인쇄소 사장님', '요약노트 제본이죠? 박자 맞춰 착착 넘겨 줘요!');
    // 책
    const cx = VW / 2, cy = VH * 0.47, pw = Math.min(130, VW * 0.36), ph = pw * 1.3;
    g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(cx, cy + ph / 2 + 10, pw * 1.1, 14, 0, 0, 7); g.fill();

function imAlbum(E, icon, text) { const S = E.G.S; if (S.album.some((a) => a.text === text && a.nth === S.nth)) return; S.album.push({ icon, text, mi: S.mi, nth: S.nth, label: imMonthLabel(S.mi) }); }
const imMonthLabel = (mi) => ['2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월', '1월', '2월'][mi] || '';
const imNth = (S) => IM_NTH[Math.min(S.nth - 1, IM_NTH.length - 1)];
// 다음 일정 시작까지 남은 분 (자유 활동 시간 상한)
function imFreeUntil(E) {

}
// 활동 시간 쓰기: 다음 일정 전까지로 자름 → 실제 쓴 분
function imUseTime(E, want) { const free = imFreeUntil(E); const use = Math.max(0, Math.min(want, free - 2)); imSpend(E, use); return use; }
function imTimeOK(E, need, what) {
  if (imFreeUntil(E) >= need) return true;

}

/* ---------- 5. 일정 (월별 · 트랙별) ---------- */
// IM_MONTHS[i].schedule 블록 {at, len, k, title, loc, sk?, opt?, soft?, part?} → 엔진 슬롯
// kind: lec | mock | study(스터디룸) | self(독서실 자습) | practice | meal | event | walk | exam1 | exam2 | sleep
const IM_LOC = { academy: 'door:academy', mock: 'door:mock', study: 'door:study', reading: 'door:reading', practice: 'door:practice', room: 'door:room', exam: 'station' };
const IM_KIND_CLS = { lec: 'g1', study: 'g3', mock: 'g2', practice: 'gs', exam1: 'g2', exam2: 'g2', self: 'free', meal: 'lunch', event: 'after', walk: 'free', sleep: 'after' };
// 지도에 없는 장소 키 보정 (컵밥거리 = 컵밥 사장님)
function imLocFix(E, loc) { if (!loc || E.posOf(loc)) return loc; if (loc === 'cupbap' && E.posOf('cupbapAj')) return 'cupbapAj'; return loc; }
function imPartTimes(E, parts) { return parts.map((p) => ({ s: E.T(p.at), e: E.T(p.at) + (p.min || 60) })); }
function imSchedFor(E, mi) {
  const S = E.G.S, t = imTrackOf(E), M = imMonths()[mi] || {}, prac = imIsPractice(t);
  if (S.rest || mi === IM_MI.LAST) return [];
  const pass1 = !!(S.exam1 && S.exam1.pass);
  if ((mi === IM_MI.RES1 || mi === IM_MI.EXAM2) && !pass1) return [];
  const L = [];
  const blocks = M.schedule || M.sched || [];
  const exParts = [];
  blocks.forEach((b) => {
    if (b.opt && !prac) return;
    if (b.k === 'exam') { exParts.push(b); return; }
    const x = { at: b.at, len: b.len || 60, title: b.title, sk: b.sk, src: b };
    const loc = IM_LOC[b.loc] || b.loc;
    if (b.k === 'event' && b.loc === 'exam') { x.kind = mi === IM_MI.EXAM2 ? 'exam2' : 'exam1'; }
    else if (b.k === 'lec') x.kind = 'lec';
    else if (b.k === 'mock') { x.kind = 'mock'; x.locOverride = 'door:mock'; }
    else if (b.k === 'study') x.kind = b.loc === 'study' ? 'study' : 'self';
    else if (b.k === 'practice') x.kind = 'practice';
    else if (b.k === 'meal') x.kind = 'meal';
    else if (b.k === 'free') x.kind = 'walk';
    else if (b.k === 'sleep') x.kind = 'sleep';
    else x.kind = 'event';
    x.loc = imLocFix(E, x.locOverride || loc);
    L.push(x);
  });
  // 시험: 입실 블록 하나를 시험 전체 슬롯으로 (교시는 트랙의 exam1/exam2.parts)
  const ex = L.find((x) => x.kind === 'exam1' || x.kind === 'exam2');
  if (ex) {
    const parts = ex.kind === 'exam1' ? imExam1Parts(E) : imExam2Parts(E);
    const tms = ex.kind === 'exam1' ? imPartTimes(E, parts) : exParts.slice(0, parts.length).map((b) => ({ s: E.T(b.at), e: E.T(b.at) + (b.len || 60) }));
    const end = tms.length ? Math.max(...tms.map((x) => x.e)) : E.T(ex.at) + 360;
    Object.assign(ex, { title: ex.kind === 'exam1' ? '1차 시험' : '2차 시험', sub: ex.kind === 'exam1' ? `${parts.length}교시 · 시험장` : `${parts.length}과목 · 시험장`, len: end - E.T(ex.at), loc: 'station', lead: 70, grace: 35 });
    if (ex.kind === 'exam1' && !S.applied) L.splice(L.indexOf(ex), 1);
    // 시험 날 오후 블록은 시험 뒤로
    L.forEach((x) => { if (x !== ex && E.T(x.at) < end && E.T(x.at) > E.T(ex.at)) x.drop = true; });
  }
  const out = L.filter((x) => !x.drop);
  // 초등 특수: 일초 강의 뒤 특학 연강
  if (t.id === 'e-sp' && mi >= 1 && mi <= IM_MI.APPLY) {
    const lec = out.find((x) => x.kind === 'lec');
    if (lec) { const st = E.T(lec.at) + lec.len; if (!out.some((x) => E.T(x.at) < st + 50 && E.T(x.at) >= st && x.kind !== 'meal')) out.push({ at: E.hm(st), len: 50, title: '특수교육학 연강', kind: 'lec', sk: 'spe', extra: true, loc: 'door:academy', sub: '쉬는 시간 없음' }); }
  }
  out.forEach((x, i) => {
    x.id = `${x.kind}${i}`;
    x.cls = IM_KIND_CLS[x.kind] || 'free';
    x.must = ['lec', 'mock', 'study', 'practice', 'exam1', 'exam2'].includes(x.kind) && !(mi === IM_MI.EXAM1 && x.kind === 'study') && !(mi === IM_MI.ARRIVE && x.kind !== 'lec');
    if (x.kind === 'sleep') x.loc = undefined;
    if (!x.must) { x.lead = x.lead ?? 20; x.grace = x.grace ?? Math.min(90, x.len); }
    if (!x.sub) x.sub = { lec: '한빛임용', mock: '모의고사실', study: '스터디룸', self: '독서실', practice: t.practiceRoom || '연습실', meal: '', event: '' }[x.kind] || '';
  });
  out.sort((a, z) => E.T(a.at) - E.T(z.at));
  return out;
}

/* ---------- 6. 날(= 달) 목록 ---------- */

/* ---------- 7. 미니 감싸기 (모듈 없으면 엔진 미니로 대체) ---------- */
const imFn = (name) => { try { const f = eval(name); return typeof f === 'function' ? f : null; } catch (e) { return null; } }; // eslint-disable-line no-eval

  return fallback ? fallback() : E.cardMini(opts.title || name, '', 'class');
}
function imLaneFallback(E, title, onEnd) { return E.laneRhythmMini({ title, lanes: ['필기', '집중', '질문'], beats: 20, onEnd }); }

  return E.formMini({ quiz: true, title, sub: `문항당 ${time || 8}초`, goal: `${qs.length}문제`, time: time || 8, sys: 'neis', steps: qs.map((q) => ({ ask: q.q || q.ask, ans: q.a || q.ans, opts: (q.opts || q.wrong || []).filter((o) => o !== (q.a || q.ans)).slice(0, 3), why: q.why })) }, { onEnd: (ok, m) => onEnd(m.score, m) });
}
const imLecture = (E, o) => imMini(E, 'imLectureMini', o, () => imLaneFallback(E, o.title, o.onEnd));
const imQuiz = (E, o) => imMini(E, 'imQuizMini', o, () => imQuizFallback(E, o.qs.slice(0, o.count || 5), o.title, o.onEnd, o.time));
const imSort = (E, o) => imMini(E, 'imSortMini', o, () => imQuizFallback(E, imQsFor(E, 'edu', 4), o.title, o.onEnd));

/* ---------- 8. 일정 입장 → 미니게임 ---------- */
function imSlotDone(E, s) { E.G.min = Math.max(E.G.min, s.e); }

    onEnd: (sc) => {

}
function imStudyAt(E, s) {

  const key = imSkKey(E, s.sk);
  const mini = imMini(E, 'imStudyMini', { track: t.id, title: s.title, qs: imQsFor(E, Math.random() < 0.4 ? 'edu' : imTrackPools(t), 4), onEnd: (sc, m) => {
    const n = imGain(E, key, 1.5 + 4.5 * sc); imStudied(E, s.e - s.s, sc);
    Object.keys(S.mates).forEach((k) => { S.mates[k] = E.clamp(S.mates[k] + (sc > 0.6 ? 3 : -2), 0, 100); });
    imMental(E, sc > 0.6 ? 4 : -2);
    E.toast(`스터디 ${Math.round(sc * 100)}% · 실력 +${n.toFixed(1)} · 스터디원 ${sc > 0.6 ? '♥' : '…'}`, sc > 0.6 ? 'ok' : '');
  } }, () => E.talkMini({ title: s.title, scene: 'room', lines: [{ who: '지은', side: 'l', text: '오늘 기출 몇 회독 했어요?', want: 'up' }, { who: '민호', side: 'r', text: '저 어제 완전 멘붕…', want: 'left' }], labels: [['← 공감', ''], ['↑ 정보', ''], ['의견 →', '']], onEnd: (mt) => { imGain(E, key, 1 + mt / 25); } }));
  E.runMinis([E.cardMini(s.title, '스터디룸 · 지은 · 민호 · 서연', 'class', 'studyroom'), mini], () => imSlotDone(E, s));
}
function imMockAt(E, s) {

  const mini = imMini(E, 'imMockMini', { qs, title: `${imMonthLabel(S.mi)} ${s.title}`, minutes: 120, track: t.id, onEnd: (sc, m) => {
    const rank = m && m.rank != null ? m.rank : Math.max(1, Math.round((1 - sc) * 180 + 5));
    const total = (m && m.total) || 200;

    if (E.G.D) E.G.D.mock = { score: Math.round(sc * 100), rank, total };

// 이벤트 블록 (튜토리얼 · 시험 날 준비 · 발표 날 등)

  if (s.loc === 'door:room') {

    if (/계약/.test(tt)) return sayDone([{ who: '고시원 원장님', text: '여기가 학생 방. 밥·김치·라면은 무한이고, 냉장고엔 이름 꼭 쓰고.' }, S.room === 'win' ? '손바닥만 한 창문. 그래도 아침이 온다는 걸 알 수 있다.' : '창문이 없다. 시계를 봐야 아침인지 안다.', '책상 위에 기본서를 쌓았다.'], () => E.statAdd('hp', 4));

      });

      pad: cfg.pad || lanes.map((l, i) => [['← ', '↑ ', ''][i] + l + (i === 2 ? ' →' : ''), ['왼쪽', '가운데', '오른쪽'][i]]),
      enter() { banner(this.kt, cfg.sub || `${lanes.join(' · ')}를 박자에 맞춰`, true); if (cfg.onEnter) cfg.onEnter(this); },
      lineY() { return VH - padV - 40; },
      update(dt, st, b, now) {

        for (const n of notes) {
          if (n.j) continue;
          const K = KK(n);
          if (n.pass && now > this.t0 + n.b * bl + 0.2) { n.j = 'pass'; this.hits++; G.combo++; sfx.good(G.combo); pop(laneX(n.lane), this.lineY() - 40, K.passText || '잘 참았어요 ✓', C.purple, 16); if (K.onPass) K.onPass(n, this); }
          else if (!n.pass && now > this.t0 + n.b * bl + jw(0.16, this.cat)) {
            n.j = 'miss'; G.combo = 0; hurt(K.missHurt ?? cfg.missHurt ?? 0.8); this.sleep.add(Math.floor(Math.random() * 8));
            pop(laneX(n.lane), this.lineY() - 30, K.missText || 'MISS', C.hot, 16);
            if (K.onMiss) K.onMiss(n, this); if (cfg.onMiss) cfg.onMiss(n, this);
          }
        }
        if (b > this.endB && !this.done) {
          this.done = true; this.acc = notes.length ? this.hits / notes.length : 1;
          if (cfg.onEnd) cfg.onEnd(this.acc, this); else toast(`${this.kt.replace('!', '')} ${Math.round(this.acc * 100)}%`, this.acc > 0.7 ? 'ok' : '');
        }
      },
      input(dir, now) {
        const lane = LANE[dir], bl = 60 / this.bpm;
        let best = null, bd = 9;
        for (const n of notes) if (!n.j && n.lane === lane) { const d = Math.abs(now - (this.t0 + n.b * bl)); if (d < bd) { bd = d; best = n; } }
        if (!best) return;
        const j = judge(now - (this.t0 + best.b * bl), this.cat);
        if (!j) return;
        const K = KK(best);
        if (best.pass) { best.j = 'press'; G.combo = 0; sfx.bad(); pop(laneX(lane), this.lineY() - 40, K.pressText || '누르지 말고 기다려요', C.hot, 15); if (K.onPress) K.onPress(best, this); return; }
        best.j = j; this.hits++; G.combo++; this.lastLane = lane; this.lastHit = now;
        if (lane === 0) this.chalk++;
        if ((K.wake || j === 'perfect') && this.sleep.size) this.sleep.delete([...this.sleep][0]);
        if (j === 'perfect') sfx.perfect();
        sfx.good(G.combo);
        pop(laneX(lane), this.lineY() - 34, K.hitText || (j === 'perfect' ? 'PERFECT' : 'GOOD'), j === 'perfect' || best.kind ? C.chalk : C.act, j === 'perfect' ? 20 : 16);
        burst(laneX(lane), this.lineY(), [C.chalk, C.info, C.act][lane], 8);
        if (K.onHit) K.onHit(best, j, this); if (cfg.onHit) cfg.onHit(best, j, this);
      },
      draw(st, b, now) {
        drawScene(cfg.bg || 'lesson', this, b, now);
        const ly = this.lineY(), bl = 60 / this.bpm, speed = (ly - 70) / 1.5, LC = [C.chalk, C.info, C.act];
        for (let l = 0; l < 3; l++) { g.fillStyle = 'rgba(10,14,30,.35)'; g.fillRect(laneX(l) - 40, 94, 80, ly - 64); }
        g.strokeStyle = C.chalk; g.lineWidth = 3; g.beginPath(); g.moveTo(10, ly); g.lineTo(VW - 10, ly); g.stroke();
        for (let l = 0; l < 3; l++) { g.strokeStyle = LC[l]; g.lineWidth = 3; g.beginPath(); g.arc(laneX(l), ly, 22, 0, 7); g.stroke(); }
        for (const n of notes) {
          if (n.j && n.j !== 'miss') continue;
          const y = ly - (this.t0 + n.b * bl - now) * speed;
          if (y < 40 || y > ly + 40) continue;
          const x = laneX(n.lane), K = KK(n);
          g.globalAlpha = n.j === 'miss' ? 0.3 : 1;
          g.fillStyle = K.color || LC[n.lane]; rr(x - 36, y - 15, 72, 30, 12); g.fill();
          if (n.pass) { g.setLineDash([5, 4]); g.strokeStyle = K.stroke || '#7A5BC7'; g.lineWidth = 2; rr(x - 36, y - 15, 72, 30, 12); g.stroke(); g.setLineDash([]); }
          else if (K.stroke) { g.strokeStyle = K.stroke; g.lineWidth = 2; rr(x - 36, y - 15, 72, 30, 12); g.stroke(); }
          g.fillStyle = '#12152A'; g.textAlign = 'center'; const lab = K.label || lanes[n.lane]; fitText(lab, 64, 16, FD); g.fillText(lab, x, y + 6);
          g.globalAlpha = 1;
        }
        const acc = notes.length ? this.hits / notes.length : 0;
        g.fillStyle = 'rgba(15,18,36,.8)'; rr(12, 70, VW - 24, 20, 8); g.fill();
        g.fillStyle = cfg.barColor || C.act; rr(14, 72, (VW - 28) * clamp((b - start) / (this.endB - 2 - start), 0, 1), 16, 7); g.fill();
        g.fillStyle = C.ink; g.font = `12px ${FB}`; g.textAlign = 'left'; g.fillText(`${this.kt.replace('!', '')} · ${Math.round(acc * 100)}%${cfg.status ? ' · ' + cfg.status(this) : ''}`, 20, 84);
      },
    };
  }

  /* ---------- (6) 화살표 타자 리듬 (가로로 흘러오는 ←↑→) ----------
     cfg = { title, sub?, doc?(종이 제목), count=10, bpm=108, style='focus', bg?, cat?, onEnd?(hits, m) }   봇: notes = [{ b, dir, j }] */
  function arrowMini(cfg = {}) {
    const notes = [], n0 = cfg.count || 10;
    return {
      type: 'arrow', bpm: cfg.bpm || 108, style: cfg.style ?? 'focus', notes, hits: 0, ok: false, cfg,
      pad: cfg.pad || [['←', '타자'], ['↑', '타자'], ['→', '타자']],
      enter() { for (let k = 0; k < n0; k++) notes.push({ b: 3 + k * (cfg.gap || 1), dir: rnd(DIRS) }); banner(cfg.title || '문서 작성!', cfg.sub || '화살표가 원에 닿을 때 같은 방향', true); },
      update(dt, st, b, now) {
        const bl = 60 / this.bpm;
        for (const n of notes) if (!n.j && now > this.t0 + n.b * bl + 0.18) { n.j = 'miss'; hurt(cfg.missHurt ?? 1); }
        if (b > notes[notes.length - 1].b + 1.5 && !this.done) { this.done = true; this.ok = true; if (cfg.onEnd) cfg.onEnd(this.hits, this); }
      },
      input(dir, now) {
        const bl = 60 / this.bpm, n = notes.find((x) => !x.j && Math.abs(now - (this.t0 + x.b * bl)) < 0.2);
        if (!n) return;
        if (n.dir !== dir) { n.j = 'miss'; sfx.bad(); hurt(cfg.missHurt ?? 1); return; }
        const j = judge(now - (this.t0 + n.b * bl), cfg.cat) || 'good';
        n.j = j; this.hits++; sfx.key(); sfx.good(this.hits);
        if (j === 'perfect') pop(VW / 2, VH * 0.4, 'PERFECT', C.chalk, 20);
      },
      draw(st, b, now) {
        drawScene(cfg.bg || 'office', this, b, now);
        g.fillStyle = C.paper; rr(VW / 2 - 120, 90, 240, 210, 8); g.fill();
        const doc = cfg.doc || cfg.title || '문서';
        g.fillStyle = '#1B2340'; g.textAlign = 'center'; fitText(doc, 220, 16, FD); g.fillText(doc, VW / 2, 118);
        for (let i = 0; i < n0; i++) { g.fillStyle = i < this.hits ? '#4A5675' : '#E4E8F0'; g.fillRect(VW / 2 - 100, 136 + i * (150 / n0), i < this.hits ? 140 + (i * 37) % 60 : 200, 6); }
        const ty = VH * 0.62, tx = 70, bl = 60 / this.bpm, sp = 150;
        g.fillStyle = 'rgba(15,18,36,.7)'; g.fillRect(0, ty - 34, VW, 68);
        g.strokeStyle = C.chalk; g.lineWidth = 4; g.beginPath(); g.arc(tx, ty, 26, 0, 7); g.stroke();
        for (const n of notes) {
          if (n.j && n.j !== 'miss') continue;
          const x = tx + (this.t0 + n.b * bl - now) * sp;
          if (x > VW + 30 || x < -30) continue;
          g.globalAlpha = n.j === 'miss' ? 0.3 : 1;
          g.fillStyle = { left: C.info, up: C.hot, right: C.act }[n.dir]; g.beginPath(); g.arc(x, ty, 22, 0, 7); g.fill();
          g.fillStyle = '#12152A'; g.font = `24px ${FD}`; g.textAlign = 'center'; g.fillText({ left: '←', up: '↑', right: '→' }[n.dir], x, ty + 8);
          g.globalAlpha = 1;
        }
      },
    };
  }

  /* ---------- (3) 카드 분류 리듬 (위에서 떨어지는 카드를 ← ↑ → 로 분류) ----------
     cfg = { title, sub?, items:[{ t, sub?, k:'left'|'up'|'right', tip?, color? }], pad?, tips?:{left,up,right}, colors?:{left,up,right}, showColor?,
             bpm, style='office', spawnB=2, gap=2.5, fall=5.6(낙하 초), missHurt=3, wrongHurt=4, missText, bg?, onSort?(item, ok, dir, m, onBeat), onMiss?(item,m), onEnd?(m) }
     봇: a = m.active(); a.y > 260 이면 act(a.src.k) */
  function sortMini(cfg = {}) {
    const notes = (cfg.items || []).map((it) => ({ src: it, x: VW / 2 + (Math.random() - 0.5) * 40, y: -40, rot: (Math.random() - 0.5) * 0.12, state: 'wait' }));
    const COL = Object.assign({ left: C.info, up: C.hot, right: C.act }, cfg.colors || {});
    return {
      type: 'sort', bpm: cfg.bpm || 116, style: cfg.style ?? 'office', notes, spawnB: cfg.spawnB ?? 2, idx: 0, tip: null, right: 0, wrongs: 0, missed: 0, cfg, COL,
      pad: cfg.pad || [['← 왼쪽', ''], ['↑ 위', ''], ['오른쪽 →', '']],
      enter() { banner(cfg.title || '분류!', cfg.sub || `${notes.length}장 · 박자에 맞춰 ← ↑ →`, true); },
      deskY() { return VH - padV - 90; },
      update(dt, st, b) {
        if (this.idx < notes.length && b >= this.spawnB) { notes[this.idx].state = 'fall'; this.idx++; this.spawnB += cfg.gap || 2.5; }
        const vy = (this.deskY() + 40) / (cfg.fall || 5.6);
        for (const n of notes) {
          if (n.state === 'fall') {
            n.y += vy * dt; n.x += Math.sin(st * 1.6 + n.rot * 20) * 6 * dt;
            if (n.y + 31 >= this.deskY() - 6) { n.state = 'gone'; G.combo = 0; this.missed++; hurt(cfg.missHurt ?? 3, cfg.missText || '놓쳤어요'); if (cfg.onMiss) cfg.onMiss(n.src, this); }
          } else if (n.state === 'fly') { n.t += dt / 0.34; if (n.t >= 1) n.state = 'gone'; }
        }
        if (this.idx >= notes.length && notes.every((n) => n.state === 'gone') && !this.done) { this.done = true; if (cfg.onEnd) cfg.onEnd(this); }
      },
      active() { let a = null; for (const n of notes) if (n.state === 'fall' && (!a || n.y > a.y)) a = n; return a; },
      input(dir, now) {
        const n = this.active(); if (!n) return;
        sfx.swipe();
        const s = n.src, ok = dir === s.k;
        s.sorted = dir;
        n.state = 'fly'; n.t = 0; n.fx = n.x; n.fy = n.y; n.dir = dir; n.ok = ok;
        n.tx = dir === 'left' ? 30 : dir === 'right' ? VW - 40 : VW / 2; n.ty = dir === 'up' ? -60 : this.deskY();
        const bl = 60 / this.bpm, b = (now - this.t0) / bl, onB = Math.abs(b - Math.round(b)) < 0.16;
        if (ok) { this.right++; G.combo++; sfx.good(G.combo); pop(n.x, n.y - 20, onB ? 'PERFECT' : 'OK', onB ? C.chalk : C.act, 20); }
        else { this.wrongs++; G.combo = 0; sfx.bad(); hurt(cfg.wrongHurt ?? 4); this.tip = { text: s.tip || (cfg.tips && cfg.tips[s.k]) || '다시 생각해 봐요!', t: 0 }; }
        if (cfg.onSort) cfg.onSort(s, ok, dir, this, onB);
      },
      draw(st, b, now) {
        drawScene(cfg.bg || 'office', this, b, now);
        const a = this.active();
        for (const n of notes) if (n !== a && (n.state === 'fall' || n.state === 'fly')) drawNote(n, false, this);
        if (a) drawNote(a, true, this);
        if (this.tip) { this.tip.t += 1 / 60; if (this.tip.t > 2.4) this.tip = null; else { g.font = `14px ${FB}`; const w = Math.min(VW - 24, g.measureText(this.tip.text).width + 28); g.fillStyle = 'rgba(255,92,108,.95)'; rr(VW / 2 - w / 2, this.deskY() - 170, w, 32, 10); g.fill(); g.fillStyle = '#1A0B10'; g.textAlign = 'center'; fitText(this.tip.text, w - 20, 14, FB); g.fillText(this.tip.text, VW / 2, this.deskY() - 149); } }
      },
    };
  }

  /* ---------- (2) 서식·퀴즈 미니 (DOM 패널) ----------
     def = { title, sub?, sys?(패널 머리 색: neis|edufine|edoc|agg|msgr|hwp|print), color?(머리 배경), path?, goal?, frame?('sys'|'sign'|'msgr'|'agg'|함수(m)→html), brand?, tabs?, query?:[[k,v]], signs?, docNo?,
             steps:[{ f(칸 이름), ask, ans, opts:[오답…] | digits:'30' | order:['1단계','2단계',…] | pick:{ need:{lv:n}, cards:[{t,lv,bad?}], label? }, show?, info?, why?, time? }],
             quiz?(틀려도 다음 문제로 · 점수제), pass=.6, time?(문항당 초), hintBeats?, stampText?, table?(false면 서식표 숨김), bg?, bpm, style, hurt=2, onEnd?(ok, m) }
     o = { forced?(나중에 버튼 숨김), from?(이어하기 단계), later?=true, laterLabel?, onEnd?(ok, m), onExit?(m) }
     봇: m.def, m.i, m.stamped, m.lock, m.correctEl() → m.click(el)   (pick 단계는 m.picks.add(c.t) 후 [data-submit]) */
  function formMini(def, o = {}) {
    const steps = def.steps || [], quiz = !!(def.quiz || o.quiz);
    const m = {
      type: 'form', bpm: def.bpm || 104, style: def.style ?? 'focus', ok: false, def, quiz, i: o.from || 0, typed: '', ord: 0, picks: new Set(), why: '', idleSince: 0, stamped: 0, lock: 0, reveal: false, stepT0: 0,
      right: 0, wrongs: 0, results: [], score: 0,
      opts: steps.map((s) => (s.opts ? shuffle([s.ans, ...s.opts]) : s.order ? shuffle(s.order.map((t, k) => ({ t, k }))) : s.pick ? shuffle(s.pick.cards.slice()) : null)),
      enter() { this.idleSince = this.stepT0 = clockNow(); this.render(); if (o.forced) banner(def.forcedText || '급하게 처리!', '', true); else if (def.banner) banner(def.banner, def.bannerSub || '', true); },
      exit() { if (o.onExit) o.onExit(this); const cb = o.onEnd || def.onEnd; if (this.stamped && cb) cb(this.ok, this); hidePanel(); },
      hintBeats() { return def.hintBeats ?? (quiz ? 999 : GAME.hintBeats ? GAME.hintBeats(E) : 4); },
      stepTime() { const s = steps[this.i]; return (s && (s.time ?? def.time ?? o.time)) || 0; },
      update(dt, st, b, now) {
        const dot = $('bt'); if (dot) dot.classList.toggle('on', (b % 1) < 0.25);
        if (this.stamped) { if (now - this.stamped > 0.9) this.done = true; return; }
        if (this.lock) { if (now >= this.lock) { this.lock = 0; this.next(); } return; }
        const s = steps[this.i]; if (!s) return;
        if ((now - this.idleSince) * this.bpm / 60 >= this.hintBeats()) { const el = this.correctEl(); if (el && !el.classList.contains('hint')) el.classList.add('hint'); }
        const tl = this.stepTime();
        if (tl) { const left = tl - (now - this.stepT0), bar = $('qtBar'); if (bar) bar.style.width = `${clamp(left / tl, 0, 1) * 100}%`; if (left <= 0) this.timeout(); }
      },
      timeout() {
        sfx.bad(); hurt(def.hurt ?? 2);
        if (quiz) { this.results[this.i] = 'timeout'; this.wrongs++; this.why = '시간 초과!' + (steps[this.i].why ? ' ' + steps[this.i].why : ''); this.reveal = true; this.render(); this.lock = clockNow() + 1.1; }
        else { this.why = '시간 초과! 다시'; this.stepT0 = clockNow(); this.render(); }
      },
      correctEl() {
        const s = steps[this.i], p = $('panel'); if (!s) return null;
        if (s.ans != null && s.opts) return p.querySelector(`[data-opt="${CSS.escape(String(s.ans))}"]`);
        if (s.digits) return p.querySelector(`[data-dg="${s.digits[this.typed.length]}"]`);
        if (s.order) return p.querySelector(`[data-ord="${this.ord}"]`);
        return null;
      },
      frame() {
        const d = def, n = steps.length, k = Math.min(this.i, n), i = this.i;
        if (typeof d.frame === 'function') return d.frame(this);
        if (d.frame === 'sys') return `<div class="neis ${d.fin ? 'fin' : ''}"><div class="nb"><b>${esc(d.brand || d.title)}</b><span>${(d.tabs || []).map((t) => `<em class="${(d.path || '').includes(t) ? 'on' : ''}">${esc(t)}</em>`).join('')}</span></div>${d.query ? `<div class="nq">${d.query.map(([a, v]) => `<span>${esc(a)} <i>${esc(v)}</i></span>`).join('')}<span class="nqb">조회</span></div>` : ''}${d.rows ? `<table class="ng"><tr>${d.rows[0].map((h) => `<th>${esc(h)}</th>`).join('')}</tr>${d.rows.slice(1).map((r) => `<tr class="${r.hl ? 'hl' : ''}">${r.map((c) => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>` : ''}</div>`;
        if (d.frame === 'sign') { const sg = d.signs || ['담당', '검토', '승인']; return `<div class="edoc"><div class="eh"><span>작성자 <b>${esc(d.author || '나')}</b></span><span>${esc(d.docNo || '')}</span></div><div class="sl" style="grid-template-columns:repeat(${sg.length},1fr)">${sg.map((r, j) => `<div><i>${esc(r)}</i><b class="${j === 0 && k >= n ? 'st' : ''}">${j === 0 && k >= n ? '서명' : j === 0 ? '…' : ''}</b></div>`).join('')}</div></div>`; }
        if (d.frame === 'msgr') { const v = (j) => (j < i ? esc(steps[j].show || steps[j].ans) : '<u>…</u>'); return `<div class="msgr"><div class="mh">✉ ${esc(d.msgTitle || '새 메시지')} <span>${hm(G.min)}</span></div>${steps.map((s, j) => (s.body ? `<div class="mbd">${v(j)}</div>` : `<div class="ml"><i>${esc(s.f)}</i>${v(j)}</div>`)).join('')}</div>`; }
        if (d.frame === 'agg') return `<div class="agg"><div class="ah">${esc(d.aggTitle || d.title)} <span>${k}/${n}</span></div><table class="ng"><tr><th>#</th><th>항목</th><th>입력값</th></tr>${steps.map((s, j) => `<tr class="${j === i ? 'hl' : ''}"><td>${j + 1}</td><td>${esc(s.f)}</td><td>${j < i ? esc(s.show || s.ans || '완료') : ''}</td></tr>`).join('')}</table></div>`;
        return '';
      },
      render() {
        const d = def, s = steps[this.i]; if (!s) return;
        const p = $('panel'); p.hidden = false; p.className = 'panel sys ' + (d.sys || '');
        const val = (k) => { const x = steps[k]; if (k < this.i) return esc(this.results[k] && this.results[k] !== 'ok' ? '✗' : x.show || x.ans || (x.order ? '순서 완성' : x.pick ? '선정 완료' : '완료')); if (k === this.i) return x.digits ? esc(this.typed || '입력하세요') : x.order ? `${this.ord}/${x.order.length}` : '선택하세요'; return ''; };
        let body = '';
        if (s.opts) body = `<div class="opts ${s.one ? 'one' : ''}">${this.opts[this.i].map((op) => `<button type="button" data-opt="${esc(op)}" class="${this.reveal && String(op) === String(s.ans) ? 'ans' : ''}">${esc(op)}</button>`).join('')}</div>`;
        else if (s.digits) body = `<div class="typed">${esc(this.typed)}<i>${'_'.repeat(Math.max(0, s.digits.length - this.typed.length))}</i></div><div class="opts keys">${'1234567890'.split('').map((k) => `<button type="button" data-dg="${k}">${k}</button>`).join('')}</div>`;
        else if (s.order) body = `<div class="opts one">${this.opts[this.i].map((op) => `<button type="button" data-ord="${op.k}" class="${op.k < this.ord ? 'used' : ''}" ${op.k < this.ord ? 'disabled' : ''}>${esc(op.t)}</button>`).join('')}</div>`;
        else if (s.pick) {
          const need = s.pick.need, cnt = {}; this.picks.forEach((t) => { const lvx = s.pick.cards.find((c) => c.t === t).lv; cnt[lvx] = (cnt[lvx] || 0) + 1; });
          const total = Object.values(need).reduce((a, z) => a + z, 0);
          body = `<div class="req">필요: ${Object.keys(need).map((k) => `${k} ${need[k]}`).join(' · ')}  (지금 ${Object.keys(need).map((k) => `${k} ${cnt[k] || 0}`).join(' · ')})</div><div class="opts">${this.opts[this.i].map((c) => `<button type="button" data-pk="${esc(c.t)}" class="${this.picks.has(c.t) ? 'on' : ''}">${esc(c.t)}<small>${esc(s.pick.label || '난이도')} ${esc(c.lv)}</small></button>`).join('')}</div><div class="opts one"><button type="button" data-submit="1">이 ${total}개로 확정</button></div>`;
        }
        const later = !quiz && !o.forced && o.later !== false;
        const qs = quiz ? `<div class="qscore">${steps.map((_, k) => `<span class="${this.results[k] === 'ok' ? 'ok' : this.results[k] ? 'no' : k === this.i ? 'cur' : ''}">${this.results[k] === 'ok' ? '○' : this.results[k] ? '✗' : k + 1}</span>`).join('')}</div>` : '';
        const showTable = !quiz && d.table !== false && d.frame !== 'msgr' && d.frame !== 'agg';
        p.innerHTML = `<div class="ph" ${d.color ? `style="background:${d.color}"` : ''}><b>${esc(d.title || '')}</b><span>${esc(d.sub || '')}</span><i class="bt" id="bt"></i>${later ? `<button class="x" type="button" data-later="1">${esc(o.laterLabel || '나중에')}</button>` : ''}</div>

  let hudBottom = 70;
  function drawHUD() {

    let y = 7;

      g.fillStyle = col; rr(12, by, Math.max(h, lw * clamp(v / max, 0, 1)), h, h / 2); g.fill();
      g.font = `${h >= 12 ? 10 : 9}px ${FB}`; g.textAlign = 'left'; g.lineWidth = 3; g.strokeStyle = 'rgba(15,18,36,.85)'; g.strokeText(label, 17, by + h - 2.5); g.fillStyle = '#fff'; g.fillText(label, 17, by + h - 2.5);

  function drawFX() {

  /* =====================================================================

    const pctT = (mm) => ((clamp(mm, TL0, TL1) - TL0) / (TL1 - TL0)) * 100;

    const qToday = pendingQuests().filter((q) => q.due != null && Math.floor(q.due / 1440) === G.dayIdx);
    const key = [G.dayIdx, Math.floor(m), JSON.stringify(G.D.done), inMini, qToday.length, (G.D.marks || []).length, G.D.sideRev || 0].join('|');

        if (x.go) go = typeof x.go === 'function' ? x.go(x, E) : go;
        const bd = st ? `<span class="bd ${st}">${st === 'ok' ? '✓' : st === 'late' ? '지각' : CFG.missLabel}</span>` : '';
        h += `<div class="slot ${cls}" style="top:calc(${pctT(x.s)}% + 1px);height:calc(${pctT(x.e) - pctT(x.s)}% - 2px)"><i>${hm(x.s)}${x.sub ? ' · ' + esc(x.sub) : ''}</i><b>${esc(x.title)}</b>${go ? `<u class="go">${esc(go)}</u>` : ''}${bd}</div>`;

      else html = `${esc(CFG.endLabel)}<b>${hm(dayEnd())}</b><em>${m >= dayEnd() ? '출구로!' : '남은 할 일 처리'}</em>`;

    arrow: () => [arrowMini({ title: '답안 쓰기!', doc: '교육학 논술 답안지', count: 8 })],
    sort: () => [sortMini({ title: '오답 노트 분류!', sub: '개념 ← · 암기 ↑ · 적용 →', pad: [['← 개념', '이해 부족'], ['↑ 암기', '외우기'], ['적용 →', '문제 풀기']], showColor: true,
      items: [{ t: '피아제 단계 헷갈림', sub: '구체적 조작기 vs 형식적', k: 'left' }, { t: '교육과정 고시 연도', sub: '2022 개정', k: 'up' }, { t: '사례형 서술 실수', sub: '지문 근거 누락', k: 'right' }, { t: '비고츠키 ZPD', sub: '근접발달영역 정의', k: 'left' }],
      tips: { left: '이해가 부족하면 ← 개념', up: '단순 암기는 ↑', right: '풀이 실수는 → 적용' } })],
    form: () => [formMini({ sys: 'agg', frame: 'agg', title: '원서 접수', sub: '시·도 교육청 · 연습용', path: '임용시험 › 원서 접수 › 응시 정보', goal: '1차 시험 원서 접수', steps: [
      { f: '응시 지역', ask: '응시할 지역 선택', ans: '서울', opts: ['부산', '제주', '세종'] },
      { f: '응시 과목', ask: '내 과목은?', ans: '국어', opts: ['영어', '수학', '체육'] },
      { f: '응시료', ask: '응시료 42000원 입력', digits: '42000', show: '42,000원' },
      { f: '순서', ask: '접수 순서대로 누르기', order: ['사진 업로드', '정보 확인', '결제'] }] })],
    quiz: () => [formMini({ quiz: true, sys: 'neis', title: '교육학 OX 퀴즈', sub: '문항당 8초', goal: '4문제 중 3문제 이상', time: 8, steps: [
      { ask: '근접발달영역(ZPD)을 제시한 학자는?', ans: '비고츠키', opts: ['피아제', '브루너', '스키너'], why: 'ZPD = 비고츠키' },
      { ask: '형성평가의 주목적은?', ans: '학습 개선 피드백', opts: ['서열 매기기', '선발', '자격 부여'] },
      { ask: '조작적 조건화를 체계화한 학자는?', ans: '스키너', opts: ['파블로프', '반두라', '손다이크'] },
      { ask: '2022 개정 교육과정의 핵심어는?', ans: '역량', opts: ['암기', '진도', '서열'] }] })],
    talk: () => [talkMini({ title: '스터디 토론', sub: '공감 ← · 정보 ↑ · 의견 →', scene: 'room', board: '교육학 스터디 · 3주차', meterName: '스터디 분위기', bpm: 104,
      labels: [['← 공감', '“맞아요ㅠ”'], ['↑ 정보', '“그거 ~예요”'], ['의견 →', '“제 생각엔”']], fb: { left: '힘든 얘기엔 공감부터!', up: '궁금한 건 정확한 정보로!', right: '토론엔 내 의견!' },
      lines: [{ who: '스터디장', side: 'l', text: '어제 모의고사 완전 망했어요…', want: 'left' }, { who: '나', side: 'c', text: '(노트를 펼친다)' }, { who: '동기', side: 'r', text: '1차 시험 날짜 언제였죠?', want: 'up' }, { who: '스터디장', side: 'l', text: '논술은 서론부터 쓸까요, 개요부터?', want: 'right' }] })],
    tap: () => [tapMini({ title: '독서실 총무 호출!', sub: '9~12박에 ↑ 로 꾸벅', who: '독서실 총무', face: 'angry', taps: [9, 10, 11, 12], tapText: '꾸벅', padLabel: ['↑ 꾸벅', '죄송합니다!'], lines: [[1.5, 'c', '저기요!!'], [3, 'c', '독서실에서 컵라면은 안 돼요!'], [5.5, 'm', '죄, 죄송합니다…!'], [13.5, 'c', '…다음엔 휴게실에서 드세요.']], onTap: () => heal(2) })],
    phone: () => [phoneMini('엄마', [[2, 'c', '밥은 먹고 다니니?'], [4, 'c', '반찬 보냈다~'], [6, 'm', '응 엄마! 잘 먹을게요ㅠ']], { end: 8 })],
  };
  function demo(name) {
    if (name === 'day') { hideOverlay(); resetRun(); startDay(0); return true; }
    const f = DEMOS[name]; if (!f) return false;
    if (!G.D) { hideOverlay(); resetRun(); startDay(0, true); }
    if (G.dlg) { G.dlg = null; $('dlg').hidden = true; G.mode = 'world'; }
    if (G.mode === 'mini') { G.miniQ = []; G.miniDone = null; if (G.mini && G.mini.exit) G.mini.exit(); G.mini = null; }
    hidePanel(); hideOverlay(); G.paused = false; G.dash = null;
    runMinis(f(), () => toast(`데모 ${name} 끝`, 'ok'));
    return true;
  }
  window.__game = {
    G, E, update, draw, act, interact, objective, isSolid, clockNow, tileCenter, advDlg, findNear, dash, runMinis, startDay, endDay, posOf, daySched, pendingQuests, completeQuest, addQuest,
    renderQuest, renderSide, demo, DEMOS, DOORS, FURN, NPCS, get MW() { return MW; }, get MH() { return MH; }, TS,
  };
  window.IMGO = E;

  /* =====================================================================
     20. 데모 콘텐츠 (window.IMGO_GAME 이 없을 때) — 작은 노량진 골목 지도 + 2일 일정
     실제 게임은 같은 모양의 객체를 window.IMGO_GAME 으로 넘기면 됨
     ===================================================================== */
  function demoContent() {
    return {
      config: { title: '임고 RPG 엔진', subtitle: '노량진 데모 골목', mapName: '노량진 데모', tag: '수험생 · 국어', spawn: [12, 12], timeline: ['08:00', '19:00'], dayStart: '08:30', dayEnd: '18:00', hardEnd: '19:00', stars: ['seat'],
        wander: { count: 5, tiles: '._', greet: ['합격하자!', '화이팅~', '밥 먹었어요?'] } },
      initState: () => ({ hp: 100, mp: 80, score: 0 }),
      bars: (E) => [E.CFG.bars[0], E.CFG.bars[1], { key: 'score', label: '공부 점수', max: 300, color: '#6DB5FF' }],
      hudLines: (E) => [`${E.CFG.tag} · ${E.day.label} ${E.day.title}`, `오늘 퀘스트 ${E.pendingQuests().length}개 · 콤보 ${E.G.combo}`, '데모 맵: window.__game.demo(이름)'],
      buildMap(M) {
        M.size(26, 20);
        M.carve(2, 8, 23, 10, '.');                       // 학원 복도
        M.carve(3, 2, 11, 6, 'r'); [4, 6, 8, 10].forEach((x) => { M.put(x, 3, 'T'); M.put(x, 5, 'T'); });
        M.door('201', 7, 7, 7, 8, { label: '201호 강의실', plate: '201호', color: '#6DB5FF', text: '1타 강사님 강의실. 강의 시간에 다시 와요.' });
        M.carve(14, 2, 22, 6, ','); M.set(18, 7, '.');    // 독서실 (걸어 들어감)
        [15, 16, 17].forEach((x) => M.put(x, 3, 'd')); M.put(19, 3, 'p', 'seat', '내 독서실 자리'); [20, 21].forEach((x) => M.put(x, 3, 'd'));
        [15, 17, 19, 21].forEach((x) => M.put(x, 6, 'b'));
        M.carve(2, 12, 8, 14, 'f'); M.set(5, 11, '.');    // 편의점
        M.put(3, 12, 'M', 'store', '편의점 계산대', { text: '삼각김밥 1+1 행사 중!' }); M.put(7, 12, 'v', 'vend', '자판기');
        M.carve(12, 11, 13, 14, '.'); M.carve(1, 15, 24, 15, '_'); M.carve(1, 16, 24, 18, '=');
        M.put(22, 9, 'o'); M.put(3, 9, 'o');
        M.spot('exit', 12.5, 17, '집으로 · 귀가');
        M.npc({ id: 'tutor', name: '1타 강사', tx: 9, ty: 9, body: '#283A6B', hair: '#E6E6E6', glasses: true, lines: ['교육학은 키워드 싸움이에요!', ['기출 3회독 했어요?', '안 했으면 오늘부터!']] });
        M.npc({ id: 'friend', name: '스터디원', tx: 20, ty: 9, body: '#3F8F6A', hair: '#3A2A24', pony: true, lines: [{ who: '스터디원', text: '4시 반에 스터디 잊지 마요!' }] });
        M.room('201호', 7, 4.6); M.room('독서실', 18, 5.2); M.room('편의점', 5, 14.2); M.room('노량진로', 18, 17.4);
      },
      days: [
        { id: 'd1', label: 'D-120', dow: '월', title: '노량진 첫날', start: '08:30', end: '18:00', brief: ['09:00 오전 강의 (201호)', '16:30 스터디 (스터디원)', '편의점에서 점심 사기'],
          sched: [{ at: '09:00', len: 100, title: '교육학 강의', sub: '201호', cls: 'g1', loc: 'door:201' }, { at: '12:00', len: 60, title: '점심', cls: 'lunch' }, { at: '13:00', len: 200, title: '자습', cls: 'free' }, { at: '16:30', len: 60, title: '스터디', cls: 'g3', loc: 'friend' }],
          quests: [{ id: 'q-lunch', title: '삼각김밥 사기', at: 'store', dueAt: '13:00', color: '#FF9F6B' }, { id: 'q-seat', title: '독서실 자리에서 기출 풀기', at: 'seat', dueAt: '17:30', color: '#6DB5FF' }],
          intro: [{ who: '나', text: '노량진 첫날! 오른쪽 위 지도와 퀘스트를 확인하자.' }],
          events: [{ at: '10:30', toast: '[문자] 엄마: 밥 꼭 챙겨 먹어~' }] },
        { id: 'd2', label: 'D-119', dow: '화', title: '모의고사 날', brief: ['10:00 모의고사', '자습'], sched: [{ at: '10:00', len: 120, title: '모의고사', cls: 'g2', loc: 'door:201' }, { at: '12:00', len: 60, title: '점심', cls: 'lunch' }] },
      ],
      onSlotEnter(s, late, E) {
        if (s.loc === 'friend') return E.runMinis([E.cardMini('스터디', '공감 ← · 정보 ↑ · 의견 →', 'class', 'room'), E.DEMOS_TALK()], () => { E.G.min = Math.max(E.G.min, s.e); });
        E.defaultSlotEnter(s);
      },
      onQuest(q, it, E) {
        if (q.id === 'q-seat') return E.runMinis([E.formMini({ quiz: true, title: '기출 풀기', sub: '독서실', goal: '2문제', time: 10, steps: [{ ask: '구성주의 학습의 핵심은?', ans: '학습자의 의미 구성', opts: ['반복 암기', '교사 주도 전달', '보상'] }, { ask: '메타인지란?', ans: '자기 사고에 대한 인식', opts: ['단기 기억', '감각 기억', '동기'] }] }, { onEnd: (ok, m) => E.statAdd('score', m.right * 20) })], () => E.completeQuest(q.id));
        E.say([{ who: '편의점', text: '삼각김밥 1+1! 체력 +10' }], () => { E.heal(10); E.sfx.coin(); E.completeQuest(q.id); });
      },
      score: (E) => E.stat('score') * 10 + E.stat('hp') + E.stat('mp'),
    };
  }
  E.DEMOS_TALK = () => DEMOS.talk()[0];

  /* =====================================================================
     21. 시작
     ===================================================================== */
  if (window.IMGO_GAME && (CFG.docTitle || CFG.title)) document.title = CFG.docTitle || CFG.title;
  buildMap();
  resetRun();
  let last = performance.now();
  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    update(dt); draw(); renderSide(); renderQuest();
    requestAnimationFrame(frame);
  }
  resize();
  if (muted) { $('muteBtn').textContent = '×'; $('muteBtn').setAttribute('aria-label', '소리 켜기'); }
  titleCard();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
  if (GAME.onBoot) GAME.onBoot(E);
  requestAnimationFrame(frame);
})();
</script>
